name: service release

# Reusable workflow: annotate a release for a service that already exists, and
# let the project's pipeline decide where it goes.
#
# Every understory service releasing through forest calls this instead of
# copy-pasting the steps, so a fix here reaches all of them at once. The
# caller's job is a thin `uses:` block:
#
#     release:
#       needs: [test, build-and-push]
#       uses: understory-io/forest/.github/workflows/service-release.yml@stable
#       secrets: inherit
#
# ── Note there is no branch condition ──────────────────────────────────
#
# This workflow annotates and stops. An annotation is a record that a build
# exists; it deploys nothing by itself. Which branch is allowed to reach which
# environment is the trigger's business — `--branch '^main$'` — and the
# project's policies', which take a `--branch-pattern` of their own.
#
# Putting `if: github.ref == 'refs/heads/main'` on the caller duplicates that
# decision into every repo's YAML, which is the thing this workflow exists to
# stop. Worse, the two can disagree: a repo whose `if:` says `main` while its
# trigger says `^release/.*$` silently never deploys, and nothing anywhere
# reports a conflict.
#
# The cost is that a feature branch also uploads its artifact and records an
# annotation. That is the intended shape — you can see what was built before
# deciding to promote it — but it is not free, so a repo that pushes very
# frequently may still want a condition. Set it deliberately if so.
#
# ── Why @stable rather than a version tag ──────────────────────────────
#
# `stable` is a branch this repo moves deliberately, not on every release. A
# version tag would be safer in isolation and worse in practice: every service
# calling this would need its own bump commit to pick up a fix, so twelve repos
# would drift apart exactly the way the copy-pasted jobs did — which is the
# thing this workflow exists to stop.
#
# The pinning still exists, it just moved. `forest-version` below is an exact
# version, and it is bumped in the same change that moves `stable`. So the
# decision "this forest release is safe to deploy with" is made once, here,
# rather than twelve times or not at all.
#
# To move it:
#
#     git push origin <sha>:refs/heads/stable --force-with-lease
#
# Move it to a commit that has been released and whose install.sh has finished
# uploading — `setup-forest` resolves a version, and a release whose assets are
# still in flight is not usable yet.
#
# ── Why this annotates rather than releases ────────────────────────────
#
# It records a release and stops. The project's trigger — by convention
# `deploy-main-via-pipeline`, matching branch `^main$` and source type `^ci$` —
# fires the project's pipeline off that annotation. Releasing from here as well
# would double-fire or race it.
#
# That indirection is the point. Which environments a release reaches, and in
# what order, is configuration on the project rather than YAML copied between
# repos:
#
#     dev-then-prod   deploy-dev (data-dev) -> deploy-prod (data)
#     prod-only       deploy-prod (data)
#
# Changing a service's rollout shape — adding a dev stage once its dev service
# is healthy, say — touches no CI at all.
#
# `source-type: ci` is load-bearing rather than decorative: a trigger matching
# `^ci$` will not fire without it, and an annotation made from a laptop does not
# match, so it records a release without deploying anything.
#
# ── Why waiting is safe to leave to forest ─────────────────────────────
#
# The destination's provider watches the rollout: stability is
# `deployments == 1 && running == desired`, a deployment-identity change at the
# end is a rollback and fails, and its timeout is failure — our `ecs-task`
# module does not enable the deployment circuit breaker, so a bad image never
# reports FAILED, it simply never converges.
#
# `aws ecs wait services-stable`, which the canopy-deploy step this replaced
# used, returns *success* after a circuit-breaker rollback, because a
# rolled-back deployment is itself perfectly stable (US-9330). That is why a
# dev-then-prod pipeline means something: dev has to genuinely converge before
# prod is touched.

on:
  workflow_call:
    inputs:
      forest-version:
        description: >-
          forest CLI to install. An exact version, never `latest`: callers track
          this workflow through the mutable `stable` branch, so this line is the
          one place where "which forest CLI deploys our services" is decided.
          Bump it in the same change that moves `stable`.

          The floor is v0.3.8: services onboarded this way declare destinations
          without a component, which every earlier CLI refused to prepare, and
          0.3.8 is the first release whose tag actually contains that fix —
          v0.3.7 was cut by hand on an older commit and ships code predating it.
        type: string
        required: false
        default: v0.3.8
      cue-version:
        description: >-
          `forest release prepare` evaluates forest.cue by shelling out to
          `cue`; forest does not vendor it and it is not on the runner.
        type: string
        required: false
        default: v0.17.1
      working-directory:
        description: Directory holding the project's forest.cue.
        type: string
        required: false
        default: "."
      image-tag:
        description: >-
          Container image tag to deploy, injected into the render as
          `--set <image-component>.image.tag=<value>`.

          The ONE thing a release should inject from outside, and the
          reason it matters: a service whose forest.cue pins a moving tag
          (`:main`) republishes the image under a name Terraform has
          already seen, so a code-only merge produces no diff, no new
          task definition, and the old container keeps running. Pinning
          the tag per release makes the roll a consequence of deploying a
          specific build rather than something a second destination has
          to force.

          Pass the tag the build job actually pushed — a job output, not
          a re-derivation — so the release deploys the image that was
          built and not whatever the branch tag points at by then.

          Empty renders with whatever forest.cue declares, which is the
          behaviour every existing caller had.
        type: string
        required: false
        default: ""
      image-component:
        description: >-
          Which component's `image.tag` `image-tag` sets. Only consulted
          when `image-tag` is non-empty.
        type: string
        required: false
        default: understory/service
      runs-on:
        description: >-
          Runner label. Defaults to a hosted runner: this job builds nothing, so
          it has no reason to occupy a self-hosted build machine.
        type: string
        required: false
        default: ubuntu-latest
    outputs:
      slug:
        description: The forest release slug, for a caller that wants to link to it.
        value: ${{ jobs.release.outputs.slug }}

permissions:
  contents: read

jobs:
  release:
    name: release
    runs-on: ${{ inputs.runs-on }}

    # One rollout at a time per calling repository. Two merges in quick
    # succession would otherwise race for the same ECS service and the older
    # image could land last. `cancel-in-progress: false` because a run that has
    # already started an UpdateService must be allowed to see it through.
    concurrency:
      group: forest-service-release-${{ github.repository }}
      cancel-in-progress: false

    outputs:
      slug: ${{ steps.annotate.outputs.slug }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: cue-lang/setup-cue@v1.0.1
        with:
          version: ${{ inputs.cue-version }}

      # Fail here, loudly, rather than three steps later inside a gRPC
      # transport error. A missing token is a setup problem with a one-line fix
      # and should read like one.
      - name: Check the forest token is configured
        env:
          FOREST_TOKEN: ${{ secrets.FOREST_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${FOREST_TOKEN:-}" ]; then
            echo "::error::FOREST_TOKEN is not set. It is an org-level secret with private visibility — if this repo is public it will not receive it. Pass \`secrets: inherit\` from the calling workflow." >&2
            exit 1
          fi

      - name: Install forest CLI
        uses: understory-io/forest/.github/actions/setup-forest@v0.3.8
        with:
          version: ${{ inputs.forest-version }}
          gh-token: ${{ secrets.GO_PRIVATE_MODULES_PAT }}
          token: ${{ secrets.FOREST_TOKEN }}

      # Renders forest/config.json — the file carrying this repo's own config,
      # notably which ECS service it is, to a destination shared with every
      # other project releasing into that account.
      - name: Render the deployment
        working-directory: ${{ inputs.working-directory }}
        env:
          IMAGE_TAG: ${{ inputs.image-tag }}
          IMAGE_COMPONENT: ${{ inputs.image-component }}
        run: |
          set -euo pipefail
          if [ -n "${IMAGE_TAG}" ]; then
            echo "pinning ${IMAGE_COMPONENT}.image.tag=${IMAGE_TAG}"
            forest release prepare --set "${IMAGE_COMPONENT}.image.tag=${IMAGE_TAG}"
          else
            forest release prepare
          fi

      # `detect` attributes the release to whoever wrote the commit. Without it
      # the server stamps whoever owns FOREST_TOKEN, which is the same person
      # for every repo sharing the org secret.
      - name: Annotate the release
        id: annotate
        uses: understory-io/forest/.github/actions/release@v0.3.8
        with:
          detect: true
          source-type: ci
          working-directory: ${{ inputs.working-directory }}

      - name: Summary
        env:
          SLUG: ${{ steps.annotate.outputs.slug }}
        run: |
          {
            echo "### forest release \`$SLUG\`"
            echo
            echo "Annotated. The project's trigger decides where it goes — see the pipeline on the project in forest."
          } >> "$GITHUB_STEP_SUMMARY"
