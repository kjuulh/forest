name: Release Please

# Drives the release flow for the forest CLI.
#
# release-please-config.json declares ONE package rooted at the repo
# root (`.`). That means *every* conventional-commit on main —
# regardless of scope or which path it touched — is considered for a
# version bump. Previously the package was scoped to
# `apps/forest/crates/forest`, which meant install-script / CI /
# README / forage commits silently never triggered a release; that's
# fixed here by widening the path.
#
# Because `release-type: simple` doesn't know about Cargo.toml, the
# config uses `extra-files` to bump
# `apps/forest/crates/forest/Cargo.toml`'s `$.package.version`, and the
# step below syncs `apps/forest/Cargo.lock` into the same PR. CHANGELOG
# stays at `apps/forest/crates/forest/CHANGELOG.md`.
#
# The lock has to be bumped *in the release PR* rather than only in the
# build, which is what used to happen: `release.yml` ran `cargo update
# -p forest` in its own ephemeral workspace so `--locked` builds passed,
# and nothing ever committed the result. Releases were fine and the
# committed lock fell one version behind on every one of them — enough
# that `cargo build --locked` failed on a fresh checkout of main, and
# that anyone running a plain `cargo build` picked up a stray lock diff
# in an unrelated PR.
#
# Merging the release-please PR creates a `v<version>` tag and
# publishes a GitHub release; `release.yml` then takes over to build
# the cross-platform binaries and attach install.sh.
#
# The GitHub App token (BREW_APP_ID / BREW_SSH_KEY) authenticates the
# action. Its installation must include the `forest` repository — an
# org-admin one-time setting.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.BREW_APP_ID }}
          private-key: ${{ secrets.BREW_SSH_KEY }}

      - uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}

      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ steps.app-token.outputs.token }}

      # Done as a text edit rather than with `cargo update -p forest`,
      # which is the obvious approach and the wrong one here: cargo wants
      # to load every source in the workspace, and forest-server depends
      # on a private git repo. On a developer machine that already sits in
      # the cargo cache so `--offline` looks fine; on a clean runner it
      # fails outright — which is exactly how the first attempt at this
      # broke the release job.
      #
      # The script needs no toolchain, no network and no credentials, and
      # can only change the `version` on the workspace's own `forest`
      # entry. Every external dependency stays exactly as locked.
      #
      # Runs on every push to main and is idempotent, so it also repairs
      # itself if release-please rewrites the branch from under it.
      - name: Sync Cargo.lock into the release PR
        if: steps.release.outputs.pr
        env:
          PR: ${{ steps.release.outputs.pr }}
        run: |
          set -euo pipefail
          branch="$(printf '%s' "$PR" | jq -r '.headBranchName')"
          if [ -z "$branch" ] || [ "$branch" = "null" ]; then
            echo "::warning::release-please reported a PR with no branch name — skipping the lockfile sync."
            exit 0
          fi

          git fetch origin "$branch"
          git checkout "$branch"

          python3 scripts/sync-cargo-lock-version.py .

          if git diff --quiet -- apps/forest/Cargo.lock; then
            echo "Cargo.lock already agrees with the bumped version."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/forest/Cargo.lock
          git commit -m "chore: sync Cargo.lock with the released version"
          git push origin "$branch"
