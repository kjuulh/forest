name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.BREW_APP_ID }}
          private-key: ${{ secrets.BREW_SSH_KEY }}

      - uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}

      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ steps.app-token.outputs.token }}

      - name: Sync Cargo.lock into the release PR
        if: steps.release.outputs.pr
        env:
          PR: ${{ steps.release.outputs.pr }}
        run: |
          set -euo pipefail
          branch="$(printf '%s' "$PR" | jq -r '.headBranchName')"
          if [ -z "$branch" ] || [ "$branch" = "null" ]; then
            echo "::warning::release-please reported a PR with no branch name — skipping the lockfile sync."
            exit 0
          fi

          git fetch origin "$branch"
          git checkout "$branch"

          python3 scripts/sync-cargo-lock-version.py .

          if git diff --quiet -- apps/forest/Cargo.lock; then
            echo "Cargo.lock already agrees with the bumped version."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/forest/Cargo.lock
          git commit -m "chore: sync Cargo.lock with the released version"
          git push origin "$branch"
