name: publish build component

on:
  workflow_dispatch:
    inputs:
      component:
        description: Which build component to publish.
        type: choice
        required: true
        options:
          - build-go
          - build-rust
          - build-docker
      context-name:
        description: forest context to provision on the runner.
        type: string
        required: false
        default: understory-prod
      server:
        description: Registry to publish to.
        type: string
        required: false
        default: https://api.forest.understory.sh

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  SQLX_OFFLINE: "true"

jobs:
  build:
    name: build ${{ matrix.os }}/${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            os: linux
            arch: amd64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            os: linux
            arch: arm64
          - runner: macos-latest
            target: aarch64-apple-darwin
            os: macos
            arch: arm64
          - runner: macos-latest
            target: x86_64-apple-darwin
            os: macos
            arch: amd64
    steps:
      - uses: actions/checkout@v6

      - name: Setup ssh agent
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.HB_GITHUB_SSH_KEY }}
      - name: Setup git for private auth
        run: |
          git config --global url."ssh://git@github.com".insteadOf https://github.com
          mkdir -p -m 0600 ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - uses: jdx/mise-action@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add the cross target
        if: matrix.target == 'x86_64-apple-darwin'
        run: rustup target add x86_64-apple-darwin

      - name: Build
        working-directory: apps/forest
        run: cargo build --release --target ${{ matrix.target }} -p ${{ inputs.component }}

      - name: Stage the artifact
        working-directory: apps/forest
        run: |
          set -euo pipefail
          out="components/forest-contrib/${{ inputs.component }}/.forest/component/output/${{ matrix.os }}/${{ matrix.arch }}"
          mkdir -p "$out"
          cp "target/${{ matrix.target }}/release/${{ inputs.component }}" "$out/${{ inputs.component }}"
          chmod +x "$out/${{ inputs.component }}"
          ls -l "$out"
          # The filename must be unique per leg, not just the artifact name.
          # `download-artifact` with `merge-multiple` flattens every artifact
          # into one directory, so four legs all producing `out.tar.gz` collide
          # there — which surfaced as `gzip: trailing garbage ignored` and a
          # tree containing only whichever leg landed last.
          tar -czf "$RUNNER_TEMP/out-${{ matrix.os }}-${{ matrix.arch }}.tar.gz" \
            -C "components/forest-contrib/${{ inputs.component }}/.forest/component" output

      - uses: actions/upload-artifact@v4
        with:
          name: build-output-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/out-${{ matrix.os }}-${{ matrix.arch }}.tar.gz
          retention-days: 7
          if-no-files-found: error

  publish:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: jdx/mise-action@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cue
        env:
          CUE_VERSION: v0.17.1
        run: |
          set -euo pipefail
          curl -sSL "https://github.com/cue-lang/cue/releases/download/${CUE_VERSION}/cue_${CUE_VERSION}_linux_amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin cue
          cue version

      - name: Install forest CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FOREST_PROFILE: name=${{ inputs.context-name }},server=${{ inputs.server }}
          FOREST_NO_SHELL_INTEGRATION: "1"
        run: |
          set -euo pipefail
          tag=""
          candidates="$(gh api --paginate 'repos/understory-io/forest/releases?per_page=100' \
            --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name | select(test("^v[0-9]+[.][0-9]+[.][0-9]+$"))')"
          for candidate in $candidates; do
            if gh release view "$candidate" --repo understory-io/forest --json assets \
                 --jq '[.assets[].name] | any(. == "install.sh")' | grep -q true; then
              tag="$candidate"; break
            fi
          done
          if [ -z "$tag" ]; then
            echo "::error::No stable forest release with install.sh found." >&2
            exit 1
          fi
          echo "installing forest $tag"
          gh release download "$tag" --repo understory-io/forest --pattern install.sh --dir "$RUNNER_TEMP"
          bash "$RUNNER_TEMP/install.sh" "$tag"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - uses: actions/download-artifact@v4
        with:
          pattern: build-output-*
          path: ${{ runner.temp }}/artifacts
          merge-multiple: true

      - name: Reassemble the output tree
        working-directory: apps/forest/components/forest-contrib/${{ inputs.component }}
        run: |
          set -euo pipefail
          mkdir -p .forest/component
          shopt -s nullglob
          archives=("$RUNNER_TEMP"/artifacts/*.tar.gz)
          if [ ${#archives[@]} -eq 0 ]; then
            echo "::error::No build artifacts downloaded — nothing to publish." >&2
            exit 1
          fi
          for a in "${archives[@]}"; do tar -xzf "$a" -C .forest/component; done
          echo "Platforms:"
          find .forest/component/output -mindepth 2 -maxdepth 2 -type d | sort

      - name: Diagnose cue module resolution
        working-directory: apps/forest/components/forest-contrib/${{ inputs.component }}
        env:
          FOREST_SERVER: ${{ inputs.server }}
        run: |
          set -uo pipefail
          host="${FOREST_SERVER#*://}"; host="${host%%/*}"; host="${host%%:*}"
          export CUE_REGISTRY="forest.sh=registry.${host},registry.cuelang.org"
          echo "--- pwd + module"
          pwd; cat cue.mod/module.cue
          echo "--- registry manifest for the dep, straight over HTTP"
          curl -sS -o /dev/null -w 'sdk v0.7.0 -> HTTP %{http_code}\n' \
            "https://registry.${host}/v2/forest.sh/forest/sdk/manifests/v0.7.0" || true
          curl -sS -w '\ntags -> HTTP %{http_code}\n' \
            "https://registry.${host}/v2/forest.sh/forest/sdk/tags/list" 2>&1 | head -5 || true
          echo "--- cue export, unwrapped"
          cue export --out json ./*.cue > /dev/null 2>/tmp/cue.err || true
          head -20 /tmp/cue.err || true

          # Guard against the failure this whole step was written for: a
          # *mise-shimmed* cue re-injects apps/forest/mise.toml's dev
          # CUE_REGISTRY and overrides what we exported, so the exported value
          # alone proves nothing — where the binary comes from is what matters.
          cue_path="$(command -v cue)"
          echo "--- cue binary: $cue_path"
          echo "--- exported CUE_REGISTRY: ${CUE_REGISTRY}"
          case "$cue_path" in
            *mise*|*/shims/*)
              echo "::error::cue resolves through a mise shim, which re-applies apps/forest/mise.toml's development CUE_REGISTRY and overrides the exported one. That registry does not serve the prod modules, which surfaces as a bare 'module not found'. Install cue as a plain binary." >&2
              exit 1
              ;;
          esac

      - name: Publish
        working-directory: apps/forest/components/forest-contrib/${{ inputs.component }}
        env:
          FOREST_TOKEN: ${{ secrets.FOREST_TOKEN }}
          FOREST_SERVER: ${{ inputs.server }}
        run: |
          set -euo pipefail
          host="${FOREST_SERVER#*://}"; host="${host%%/*}"; host="${host%%:*}"
          export CUE_REGISTRY="forest.sh=registry.${host},registry.cuelang.org"
          echo "CUE_REGISTRY=$CUE_REGISTRY"
          forest publish

      - name: Verify the published version resolves
        working-directory: apps/forest/components/forest-contrib/${{ inputs.component }}
        env:
          FOREST_TOKEN: ${{ secrets.FOREST_TOKEN }}
          FOREST_SERVER: ${{ inputs.server }}
        run: |
          set -euo pipefail
          # `cue` is invoked directly here rather than through forest, so it
          # needs CUE_REGISTRY derived the way `contexts::derive_cue_registry`
          # does — otherwise the sdk import cannot resolve. Reads are anonymous.
          host="${FOREST_SERVER#*://}"; host="${host%%/*}"; host="${host%%:*}"
          export CUE_REGISTRY="forest.sh=registry.${host},registry.cuelang.org"
          version="$(cue export --out json ./*.cue | jq -r '.forest.component.version')"
          forest components show "forest-contrib/${{ inputs.component }}" --format json \
            | jq -e --arg v "$version" '.versions[] | select(.version == $v)' > /dev/null

          # Listed is not the same as usable. build-rust@0.1.1, build-go@0.1.5
          # and build-docker@0.1.1 all passed the check above while being
          # unusable: they were published by a CLI that did not yet upload
          # cue.mod/module.cue, so their `import "forest.sh/forest/sdk@v0"`
          # could not resolve and the component failed to parse for every
          # consumer. This step said "resolvable" for all three.
          #
          # So fetch what a consumer would fetch and evaluate it the way a
          # consumer does — from inside the component, which is where cue
          # looks for the module root.
          probe="$RUNNER_TEMP/probe"
          rm -rf "$probe" && mkdir -p "$probe"
          printf 'dependencies: {\n\t"forest-contrib/%s": version: "%s"\n}\n\nproject: {\n\tname:         "publish-verify"\n\torganisation: "forest-contrib"\n}\n' \
            "${{ inputs.component }}" "$version" > "$probe/forest.cue"
          ( cd "$probe" && forest update )

          cached="$HOME/.cache/forest/components/forest-contrib/${{ inputs.component }}/$version"
          if [ ! -f "$cached/cue.mod/module.cue" ]; then
            echo "::error::forest-contrib/${{ inputs.component }}@$version published without cue.mod/module.cue — every import in it will fail for consumers. Publish with a forest CLI that includes the cue.mod fix (>= 0.3.8)." >&2
            ls -la "$cached" >&2 || true
            exit 1
          fi
          ( cd "$cached" && cue export ./forest.cue --out json > /dev/null )
          echo "::notice::forest-contrib/${{ inputs.component }}@$version is resolvable and parses from the cache."
