name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Roll the built images onto the platform ECS clusters"
        type: boolean
        default: false

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: true

permissions:
  contents: read
  packages: write
  pull-requests: read

jobs:
  changes:
    name: what changed
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      any: ${{ steps.matrix.outputs.any }}
      forest: ${{ steps.matrix.outputs.forest }}
      forage: ${{ steps.matrix.outputs.forage }}
    steps:
      - uses: actions/checkout@v6

      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        continue-on-error: true
        with:
          filters: |
            forest:
              - 'apps/forest/**'
              - '.github/workflows/ci.yaml'
            forage:
              - 'apps/forage/**'
              - '.github/workflows/ci.yaml'

      - name: Build the matrix
        id: matrix
        env:
          OWNER: ${{ github.repository_owner }}
          FOREST: ${{ steps.filter.outputs.forest }}
          FORAGE: ${{ steps.filter.outputs.forage }}
          FILTER: ${{ steps.filter.outcome }}
        run: |
          set -euo pipefail

          if [ "$FILTER" != "success" ]; then
            echo "::notice::path filter reached no verdict (outcome=$FILTER) — building every app"
          fi

          include='[]'
          for app in forest forage; do
            case "$app" in
              forest) changed="$FOREST" ;;
              forage) changed="$FORAGE" ;;
            esac
            if [ "$changed" = "true" ] || [ "$FILTER" != "success" ]; then
              echo "$app=true" >> "$GITHUB_OUTPUT"
              include=$(jq -c --arg app "$app" --arg owner "$OWNER" '
                . + [{
                  app:     $app,
                  context: ("apps/" + $app),
                  image:   ("ghcr.io/" + $owner + "/" + $app)
                }]' <<<"$include")
            else
              echo "$app=false" >> "$GITHUB_OUTPUT"
            fi
          done

          matrix=$(jq -c -n --argjson include "$include" '{include: $include}')
          any=$(jq -r 'length > 0' <<<"$include")

          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "any=$any"       >> "$GITHUB_OUTPUT"

          echo "building: $(jq -r 'if length == 0 then "nothing" else [.[].app] | join(", ") end' <<<"$include")"

  frontend-tests:
    name: frontend tests
    needs: changes
    if: needs.changes.outputs.forage == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/forage/frontend
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/forage/frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Rendered component states
        timeout-minutes: 5
        run: npm run gallery:capture

      - name: Upload state screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lane-state-screenshots
          path: apps/forage/frontend/gallery/shots/*.png
          if-no-files-found: warn

  forage-tests:
    name: forage tests
    needs: changes
    if: needs.changes.outputs.forage == 'true'

    runs-on:
      group: rust
      labels:
        - linux-8x-amd64-001

    defaults:
      run:
        working-directory: apps/forage

    env:
      SQLX_OFFLINE: true
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0

    steps:
      - uses: actions/checkout@v6

      - name: Setup ssh agent
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.HB_GITHUB_SSH_KEY }}
      - name: Setup git for private auth
        run: |
          git config --global url."ssh://git@github.com".insteadOf https://github.com && \
          mkdir -p -m 0600 ~/.ssh && ssh-keyscan github.com >> ~/.ssh/known_hosts

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache the Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/forage
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Test
        run: cargo test --locked -p forage-ui -p forage-server

  forest-tests:
    name: forest tests
    needs: changes
    if: needs.changes.outputs.forest == 'true'

    runs-on:
      group: rust
      labels:
        - linux-8x-amd64-001

    defaults:
      run:
        working-directory: apps/forest

    env:
      DATABASE_URL: postgresql://devuser:devpassword@localhost:5432/dev
      NATS_URL: nats://localhost:4222
      S3_ENDPOINT: http://localhost:9000
      S3_BUCKET: forest
      S3_ACCESS_KEY: forestdev
      S3_SECRET_KEY: forestdevpassword
      S3_REGION: us-east-1

      SQLX_OFFLINE: true

      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0

    steps:
      - uses: actions/checkout@v6

      - name: Setup ssh agent
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.HB_GITHUB_SSH_KEY }}
      - name: Setup git for private auth
        run: |
          git config --global url."ssh://git@github.com".insteadOf https://github.com && \
          mkdir -p -m 0600 ~/.ssh && ssh-keyscan github.com >> ~/.ssh/known_hosts

      - uses: jdx/mise-action@v4
        with:
          working_directory: apps/forest
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache the Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/forest
          cache-all-crates: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install sqlx-cli
        run: cargo install sqlx-cli --version 0.9.0 --locked --no-default-features --features postgres,rustls

      - name: Start postgres, NATS and minio
        run: |
          docker compose -f ./templates/docker-compose.yaml up -d --wait postgres nats minio
          docker compose -f ./templates/docker-compose.yaml run --rm minio-init

      - name: Migrate
        run: cargo sqlx migrate run --source ./crates/forest-server/migrations/

      - name: Check the sqlx offline cache is current
        working-directory: apps/forest/crates/forest-server
        run: cargo sqlx prepare --check -- --all-targets

      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.12.6
          tofu_wrapper: false

      - name: Test
        run: cargo test --workspace

  build-and-push:
    name: build and push ${{ matrix.app }}
    needs: changes
    if: >-
      needs.changes.outputs.any == 'true'
      && !startsWith(github.head_ref, 'release-please--')
      && (
        github.event_name != 'pull_request'
        || github.event.pull_request.head.repo.full_name == github.repository
      )
    runs-on:
      group: 32xlarge

    concurrency:
      group: build-${{ matrix.app }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Extract short SHA
        id: sha
        run: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
      - name: Extract branch name
        id: branch
        run: echo "BRANCH_NAME=$(echo ${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}} | sed 's/[^a-zA-Z0-9]/-/g')" >> $GITHUB_ENV

      - name: Setup ssh agent
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.HB_GITHUB_SSH_KEY }}
      - name: Setup git for private auth
        run: |
          git config --global url."ssh://git@github.com".insteadOf https://github.com && \
          mkdir -p -m 0600 ~/.ssh && ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tag list
        id: image_tags
        run: |
          tags="${{ matrix.image }}:${{ env.BRANCH_NAME }}-${{ env.SHORT_SHA }}"
          tags="$tags"$'\n'"${{ matrix.image }}:${{ env.BRANCH_NAME }}"
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            tags="$tags"$'\n'"${{ matrix.image }}:latest"
          fi
          {
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build timestamp
        run: echo "BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_ENV

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.image_tags.outputs.tags }}
          build-args: |
            GIT_SHA=${{ env.SHORT_SHA }}
            BUILD_TIME=${{ env.BUILD_TIME }}
          ssh: |
            default=${{ env.SSH_AUTH_SOCK }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: ""

  build-ok:
    name: build ok
    needs: [changes, build-and-push, forage-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Assert that every build which ran, passed
        env:
          CHANGES: ${{ needs.changes.result }}
          BUILDS: ${{ needs['build-and-push'].result }}
          FORAGE_TESTS: ${{ needs['forage-tests'].result }}
        run: |
          set -euo pipefail
          echo "changes=$CHANGES  build-and-push=$BUILDS"

          # If the filter itself did not finish, nothing downstream means
          # anything — an empty matrix would look exactly like "nothing to do".
          if [ "$CHANGES" != "success" ]; then
            echo "::error::the changed-paths job did not succeed ($CHANGES)"
            exit 1
          fi

          # `skipped` is a pass on purpose, and it is the whole point of this
          # job: the app did not change, or the commit touched neither app, or
          # this is a fork PR that cannot reach the deploy key. None of those
          # is a build failure, and none of them should hold a PR shut.
          case "$FORAGE_TESTS" in
            success|skipped) ;;
            *) echo "::error::forage tests reported '$FORAGE_TESTS'"; exit 1 ;;
          esac

          case "$BUILDS" in
            success|skipped) echo "builds ok" ;;
            *) echo "::error::build-and-push reported '$BUILDS'"; exit 1 ;;
          esac

  deploy:
    name: deploy ${{ matrix.environment.name }}/${{ matrix.service }}
    needs: [changes, build-and-push]
    if: >-
      !cancelled()
      && needs.changes.result == 'success'
      && !contains(fromJSON('["failure", "cancelled"]'), needs['build-and-push'].result)
      && github.repository == 'understory-io/forest'
      && (
        (github.event_name == 'push' && github.ref == 'refs/heads/main')
        || (github.event_name == 'workflow_dispatch' && inputs.deploy)
      )
    runs-on: ubuntu-latest

    concurrency:
      group: platform-${{ matrix.environment.name }}-deploy-${{ matrix.service }}
      cancel-in-progress: false

    strategy:
      fail-fast: false
      matrix:
        environment:
          - name: dev
            account: "618060699933"
            key_id_secret: PLATFORM_DEV_DEPLOYMENT_AWS_ACCESS_KEY_ID
            secret_key_secret: PLATFORM_DEV_DEPLOYMENT_AWS_SECRET_ACCESS_KEY
            role_arn_var: PLATFORM_DEV_DEPLOYMENT_ROLE_ARN
          - name: prod
            account: "462774209206"
            key_id_secret: PLATFORM_DEPLOYMENT_AWS_ACCESS_KEY_ID
            secret_key_secret: PLATFORM_DEPLOYMENT_AWS_SECRET_ACCESS_KEY
            role_arn_var: PLATFORM_DEPLOYMENT_ROLE_ARN
        service:
          - forest
          - forage

    env:
      AWS_REGION: eu-west-1
      ECS_CLUSTER: infrastructure-platform

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets[matrix.environment.key_id_secret] }}
          aws-secret-access-key: ${{ secrets[matrix.environment.secret_key_secret] }}
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars[matrix.environment.role_arn_var] }}
          role-session-name: forest-ci-deploy
          role-duration-seconds: "3600"

      - name: Verify the target account
        run: |
          actual=$(aws sts get-caller-identity --query Account --output text)
          if [ "$actual" != "${{ matrix.environment.account }}" ]; then
            echo "::error::expected account ${{ matrix.environment.account }} (${{ matrix.environment.name }}), got $actual"
            exit 1
          fi
          echo "authenticated to ${{ matrix.environment.name }} ($actual)"

      - name: Log in to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the image digest
        id: digest
        run: |
          image="ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}"
          digest=$(docker buildx imagetools inspect "$image:latest" \
            --format '{{ .Manifest.Digest }}')
          if [ -z "$digest" ]; then
            echo "::error::could not resolve $image:latest to a digest"
            exit 1
          fi
          echo "image=$image@$digest" >> "$GITHUB_OUTPUT"
          echo "resolved ${{ matrix.service }} -> $digest"

      - name: Register a task definition pinned to that digest
        id: taskdef
        run: |
          # Base the new revision on the family's *latest* revision, not on the
          # one the service happens to be running.
          #
          # Terraform owns everything in the task definition except the image --
          # environment, secrets, health checks, `essential`, cpu/memory, roles
          # -- and registers a revision when any of it changes. The service is
          # `ignore_changes = [task_definition]`, so Terraform deliberately does
          # not roll that revision out; this deploy is what picks it up.
          #
          # Basing off the running revision instead would silently discard every
          # such change. It would have dropped the fungus health-sidecar
          # `essential = true` fix (DATA-594/DATA-739) on the very next deploy,
          # re-wedging a service that had never once reached steady state.
          #
          # Passing the bare family name returns the latest ACTIVE revision.
          aws ecs describe-task-definition --task-definition "${{ matrix.service }}" \
            --region "$AWS_REGION" --query 'taskDefinition' > td.json

          # Swap only this service's own container image; leave sidecars alone.
          jq --arg name "${{ matrix.service }}" --arg image "${{ steps.digest.outputs.image }}" '
            .containerDefinitions = (.containerDefinitions
              | map(if .name == $name then .image = $image else . end))
            | del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                  .compatibilities, .registeredAt, .registeredBy, .deregisteredAt)
          ' td.json > new-td.json

          arn=$(aws ecs register-task-definition \
            --cli-input-json file://new-td.json --region "$AWS_REGION" \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "arn=$arn" >> "$GITHUB_OUTPUT"
          echo "registered $arn"

      - name: Deploy that revision
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "${{ matrix.service }}" \
            --task-definition "${{ steps.taskdef.outputs.arn }}" \
            --region "$AWS_REGION" \
            --query 'service.deployments[0].[id,status,taskDefinition]' \
            --output text

      - name: Wait for service stability
        run: |
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "${{ matrix.service }}" \
            --region "$AWS_REGION"
