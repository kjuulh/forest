name: Release

on:
  release:
    types: [published]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "apps/forest/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: forest
  CARGO_DIR: apps/forest
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  build:
    name: build ${{ matrix.target }}
    if: >-
      github.event_name != 'pull_request'
      || !startsWith(github.head_ref, 'release-please--')
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup ssh agent
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.HB_GITHUB_SSH_KEY }}
      - name: Setup git for private auth
        run: |
          git config --global url."ssh://git@github.com".insteadOf https://github.com
          mkdir -p -m 0600 ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - uses: jdx/mise-action@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache the Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.CARGO_DIR }}
          key: ${{ matrix.target }}

      - name: Sync lockfile after release-please version bump
        working-directory: ${{ env.CARGO_DIR }}
        run: cargo update -p forest

      - name: Build
        working-directory: ${{ env.CARGO_DIR }}
        env:
          SQLX_OFFLINE: "true"
        run: cargo build --release --locked --target ${{ matrix.target }} -p forest

      - name: Resolve release ref
        id: ref
        run: |
          if [ -n "${{ github.event.release.tag_name }}" ]; then
            echo "name=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Package
        working-directory: ${{ env.CARGO_DIR }}
        run: |
          ARTIFACT="${BINARY_NAME}-${{ steps.ref.outputs.name }}-${{ matrix.target }}.tar.gz"
          tar czf "$ARTIFACT" -C target/${{ matrix.target }}/release "${BINARY_NAME}"
          shasum -a 256 "$ARTIFACT" > "${ARTIFACT}.sha256"
          # Surface absolute paths to the upload step.
          echo "ARTIFACT_PATH=${PWD}/${ARTIFACT}" >> "$GITHUB_ENV"
          echo "CHECKSUM_PATH=${PWD}/${ARTIFACT}.sha256" >> "$GITHUB_ENV"

      - name: Upload to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            "${ARTIFACT_PATH}" \
            "${CHECKSUM_PATH}"

  publish-install-script:
    needs: [build]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Attach install.sh to the forest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            scripts/install.sh \
            --clobber
