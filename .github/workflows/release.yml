name: Release

on:
  release:
    types: [published]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "apps/forest/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: forest
  CARGO_DIR: apps/forest
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  build:
    name: build ${{ matrix.target }}
    if: >-
      github.event_name != 'pull_request'
      || !startsWith(github.head_ref, 'release-please--')
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup ssh agent
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.HB_GITHUB_SSH_KEY }}
      - name: Setup git for private auth
        run: |
          git config --global url."ssh://git@github.com".insteadOf https://github.com
          mkdir -p -m 0600 ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - uses: jdx/mise-action@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache the Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.CARGO_DIR }}
          key: ${{ matrix.target }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Resolve the release version and stamp prereleases into Cargo.toml
        id: ref
        working-directory: ${{ env.CARGO_DIR }}
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAG: ${{ github.event.release.tag_name }}
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          manifest=crates/forest/Cargo.toml
          declared=$(python3 -c 'import sys, tomllib; print(tomllib.load(open(sys.argv[1], "rb"))["package"]["version"])' "$manifest")
          echo "FOREST_BUILD_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

          if [ "$EVENT_NAME" != "release" ]; then
            echo "name=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
            echo "version=$declared" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          version="${TAG#v}"
          if ! printf '%s\n' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Release tag $TAG is not vMAJOR.MINOR.PATCH[-PRERELEASE]." >&2
            exit 1
          fi

          case "$version" in
            *-*)
              if [ "$IS_PRERELEASE" != "true" ]; then
                echo "::error::$TAG is a prerelease version but the GitHub release is not marked prerelease, so it would be served as the latest stable forest. Run: gh release edit $TAG --repo $GITHUB_REPOSITORY --prerelease --latest=false, then re-run this workflow." >&2
                exit 1
              fi
              base="${version%%-*}"
              highest=$(printf '%s\n%s\n' "$declared" "$base" | sort -V | tail -n1)
              if [ "$highest" != "$base" ]; then
                echo "::error::$TAG precedes $base, older than the $declared this commit declares." >&2
                exit 1
              fi
              gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/tags?per_page=100" |
                python3 -c '
          import json
          import re
          import sys

          base = tuple(map(int, sys.argv[1].split(".")))
          pages = json.load(sys.stdin)
          if not isinstance(pages, list) or not pages:
              raise SystemExit("::error::Could not read all repository tag pages")
          for page in pages:
              if not isinstance(page, list):
                  raise SystemExit("::error::Invalid repository tag page")
              for tag in page:
                  if not isinstance(tag, dict) or not isinstance(tag.get("name"), str):
                      raise SystemExit("::error::Invalid repository tag entry")
                  name = tag["name"]
                  stable = re.fullmatch(r"v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?", name)
                  if stable and tuple(map(int, stable.groups())) >= base:
                      raise SystemExit(f"::error::{name} already exists; choose a prerelease core above every existing stable tag")
          ' "$base"
              python3 - "$manifest" "$version" <<'PY'
          import pathlib
          import re
          import sys
          import tomllib

          manifest = pathlib.Path(sys.argv[1])
          version = sys.argv[2]
          stamped, count = re.subn(r'^version = ".*"$', f'version = "{version}"', manifest.read_text(), count=1, flags=re.MULTILINE)
          if count != 1 or tomllib.loads(stamped)["package"]["version"] != version:
              raise SystemExit("Could not stamp the forest package version")
          manifest.write_text(stamped)
          PY
              echo "::notice::Prerelease $TAG — building forest $version from a commit declaring $declared."
              ;;
            *)
              if [ "$IS_PRERELEASE" = "true" ]; then
                echo "::error::$TAG is a stable version but the GitHub release is marked prerelease." >&2
                exit 1
              fi
              if [ "$version" != "$declared" ]; then
                echo "::error::$TAG does not match the $declared that $manifest declares at this commit; release-please tags the commit that bumps it." >&2
                exit 1
              fi
              ;;
          esac

          echo "name=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Sync lockfile after release-please version bump
        working-directory: ${{ env.CARGO_DIR }}
        run: cargo update -p forest

      - name: Build
        working-directory: ${{ env.CARGO_DIR }}
        env:
          SQLX_OFFLINE: "true"
        run: cargo build --release --locked --target ${{ matrix.target }} -p forest

      - name: Check the binary reports the version being released
        working-directory: ${{ env.CARGO_DIR }}
        env:
          EXPECTED: ${{ steps.ref.outputs.version }}
        run: |
          set -euo pipefail
          identity=$("target/${{ matrix.target }}/release/${BINARY_NAME}" --version)
          echo "$identity"
          [ "$(printf '%s\n' "$identity" | awk 'NR == 1 { print $2 }')" = "$EXPECTED" ] \
            || { echo "::error::Built binary reports '$identity', expected forest $EXPECTED." >&2; exit 1; }
          case "$identity" in
            *"(commit ${FOREST_BUILD_COMMIT})"*) ;;
            *) echo "::error::Built binary does not carry commit ${FOREST_BUILD_COMMIT}." >&2; exit 1 ;;
          esac

      - name: Package
        working-directory: ${{ env.CARGO_DIR }}
        run: |
          ARTIFACT="${BINARY_NAME}-${{ steps.ref.outputs.name }}-${{ matrix.target }}.tar.gz"
          tar czf "$ARTIFACT" -C target/${{ matrix.target }}/release "${BINARY_NAME}"
          shasum -a 256 "$ARTIFACT" > "${ARTIFACT}.sha256"
          # Surface absolute paths to the upload step.
          echo "ARTIFACT_PATH=${PWD}/${ARTIFACT}" >> "$GITHUB_ENV"
          echo "CHECKSUM_PATH=${PWD}/${ARTIFACT}.sha256" >> "$GITHUB_ENV"

      - name: Upload to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$TAG" \
            "${ARTIFACT_PATH}" \
            "${CHECKSUM_PATH}"

  publish-install-script:
    needs: [build]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Attach install.sh to the forest release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$TAG" scripts/install.sh
