name: Release

# Builds the forest CLI for the supported platforms, attaches tarballs
# + SHA256 sums + the install script to the GitHub release.
#
# Triggered by `release-please.yml` publishing a release after a merge
# of its auto-generated release PR. The release tag is in the form
# `v<X.Y.Z>` (no component prefix, see release-please-config.json).
#
# Distribution model is single-source: everything users need to install
# forest lives on the release itself.
#
#   gh release download --repo understory-io/forest --pattern install.sh -O - | bash
#
# No homebrew tap, no mirrored install script, no separate distribution
# repo — install.sh on each release is the single source of truth and
# uses `gh release download` to fetch the matching platform tarball.
#
# This workflow intentionally builds ONLY the `forest` CLI — not
# `forest-server` (server-side, has private git deps) and not the
# `forage` BFF (Docker images for both are published separately by
# ci.yaml). The `forest` crate has no private deps and is cheap to
# build natively on each target.
#
# Windows builds are intentionally omitted — they're not on the
# supported target list (`scripts/install.sh` rejects them). Windows
# users can build from source until a Scoop / Chocolatey manifest is
# set up.

on:
  release:
    types: [published]
  # Dry-run on PRs that could affect the release build. Same matrix,
  # same SSH setup, same compile — just no upload + no formula push.
  # Catches things like a new private git dep showing up in the
  # workspace lockfile (which forced us into SSH-auth here to begin
  # with) BEFORE a tag goes out the door.
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "apps/forest/**"
  workflow_dispatch:

permissions:
  contents: write

# A publish must never be cancelled — it uploads the artefacts users install
# from, and a half-uploaded release is worse than a late one. A PR dry run is
# the opposite: it exists to tell you about the commit you just pushed, so an
# older one is only burning runner minutes.
#
# This matters because of how release-please works. It pushes its branch once
# from the action and once more from the Cargo.lock sync step seconds later, so
# every merge to main queued two full three-target dry runs. Grouping by PR
# number collapses them.
concurrency:
  group: release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: forest
  CARGO_DIR: apps/forest
  # Make cargo shell out to `git` for fetches so it picks up the SSH
  # agent + the global insteadOf rule below — same convention as
  # ci.yaml. Without this cargo uses libgit2 internally and can't talk
  # to a deploy-key-protected private repo (canopy-util-rs as of 2026-05).
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  build:
    name: build ${{ matrix.target }}
    # Skip the dry run on release-please's own PR.
    #
    # The dry run is here to catch "a new private git dep showed up in the
    # workspace lockfile" before a tag goes out. release-please's PR is the one
    # PR that structurally cannot do that: it bumps `$.package.version` on
    # `apps/forest/crates/forest/Cargo.toml`, and release-please.yml's sync step
    # rewrites exactly one `version` field on the workspace's own `forest` entry
    # in `Cargo.lock`. Every external dependency stays as locked.
    #
    # It was not a rounding error. 60 of the last 100 runs of this workflow were
    # this one PR, at three targets and ~18 min of runner time each, one of them
    # macOS at 10x — because the PR re-synchronises on every merge to main and
    # lives for days.
    #
    # The real lockfile check still happens: on every human PR that touches
    # `apps/forest/**`, and again on `release: published` before the artefacts
    # are built.
    if: >-
      github.event_name != 'pull_request'
      || !startsWith(github.head_ref, 'release-please--')
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          # 22.04, not 24.04, and this is a compatibility floor rather
          # than conservatism. A natively built binary requires the
          # builder's glibc, and 24.04 gave us 2.38/2.39 — which is newer
          # than Debian bookworm's 2.36, so the CLI simply refused to
          # start there:
          #
          #   /usr/local/bin/forest: /lib/aarch64-linux-gnu/libc.so.6:
          #   version `GLIBC_2.38' not found
          #
          # Found on the office dashboard pis, which are bookworm: forest
          # could not be installed on them at all, which in turn blocked
          # `forest global` and everything distributed through it. 22.04
          # floors this at glibc 2.35, which covers bookworm and anything
          # newer.
          #
          # If a host older than that ever needs the CLI (bullseye is
          # 2.31, buster 2.28), the answer is cargo-zigbuild with an
          # explicit `--target <triple>.2.28`, which is how the screen
          # agent gets down to GLIBC_2.30 — at the cost of introducing
          # zig into this pipeline.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      # SSH auth for private git deps (canopy-otel etc.). Same
      # pattern the Dockerfile and ci.yaml use: load the deploy key
      # into the agent, then rewrite https→ssh globally so cargo's
      # git-fetch-with-cli mode talks SSH to github.com. Without
      # this `cargo build --locked -p forest` still tries to fetch
      # other workspace members' private git deps during lockfile
      # validation.
      - name: Setup ssh agent
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.HB_GITHUB_SSH_KEY }}
      - name: Setup git for private auth
        run: |
          git config --global url."ssh://git@github.com".insteadOf https://github.com
          mkdir -p -m 0600 ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      # Match ci.yaml's Rust pin (1.93 via mise/tools). Using mise here
      # avoids drift between CI and local development. The action also
      # caches rustup downloads between runs.
      - uses: jdx/mise-action@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      # Nothing cached the Rust build here, so every one of these legs
      # compiled the CLI's whole dependency graph from nothing: measured
      # over the 40 most recent runs, 6.9 min on x86_64 linux, 5.7 on
      # arm64 linux, 5.3 on macOS — and macOS runner minutes bill at 10x.
      #
      # `workspaces` is required: the Cargo workspace is `apps/forest`,
      # not the repo root, so the default (repo root) would find no
      # Cargo.lock and cache nothing. `key` separates the three legs, all
      # of which build a different target triple into the same `target/`.
      #
      # Caches are scoped per ref, and a run can read its own ref plus
      # the default branch. This workflow never runs on a push to main,
      # so there is no main-scoped cache for a tag build to restore —
      # what this buys is the *repeated* runs on one PR, which is where
      # the minutes actually are: 95 of the last 100 runs were the
      # `pull_request` dry run, 60 of them on release-please's single
      # long-lived PR, all sharing one cache scope.
      - name: Cache the Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.CARGO_DIR }}
          key: ${{ matrix.target }}

      # All three matrix targets are *native* to their runner, so no
      # `rustup target add` is needed. If the matrix grows to include
      # cross-compiled targets (e.g. x86_64-apple-darwin on
      # macos-latest arm), add a `rustup target add ${{ matrix.target }}`
      # step here.

      # Belt and braces. release-please.yml now commits the synced lock
      # into the release PR, so on a normal release this is a no-op —
      # but it also costs nothing, and it keeps a hand-pushed tag (or a
      # `workflow_dispatch` on an older one) from failing the `--locked`
      # build below over a lockfile nobody had a chance to sync.
      #
      # `-p forest` re-resolves *only* the forest crate entry. External
      # dependency versions stay exactly as the lock already pins them.
      - name: Sync lockfile after release-please version bump
        working-directory: ${{ env.CARGO_DIR }}
        run: cargo update -p forest

      - name: Build
        working-directory: ${{ env.CARGO_DIR }}
        env:
          # forest CLI does not use sqlx but other workspace members
          # do; set this defensively so a future workspace-level
          # build.rs doesn't fail on the lack of a database.
          SQLX_OFFLINE: "true"
        run: cargo build --release --locked --target ${{ matrix.target }} -p forest

      # Tag name is set on `release: published`; absent on PR /
      # workflow_dispatch dry runs. Fall back to the short SHA so the
      # artifact has a stable name during dry-runs.
      - name: Resolve release ref
        id: ref
        run: |
          if [ -n "${{ github.event.release.tag_name }}" ]; then
            echo "name=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Package
        working-directory: ${{ env.CARGO_DIR }}
        run: |
          ARTIFACT="${BINARY_NAME}-${{ steps.ref.outputs.name }}-${{ matrix.target }}.tar.gz"
          tar czf "$ARTIFACT" -C target/${{ matrix.target }}/release "${BINARY_NAME}"
          shasum -a 256 "$ARTIFACT" > "${ARTIFACT}.sha256"
          # Surface absolute paths to the upload step.
          echo "ARTIFACT_PATH=${PWD}/${ARTIFACT}" >> "$GITHUB_ENV"
          echo "CHECKSUM_PATH=${PWD}/${ARTIFACT}.sha256" >> "$GITHUB_ENV"

      - name: Upload to release
        # Only on real release publish. PR / manual dry runs build the
        # tarball but stop here.
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            "${ARTIFACT_PATH}" \
            "${CHECKSUM_PATH}"

  publish-install-script:
    # End users can't `curl | bash` directly from the forest repo because
    # it's private — but they can `gh release download` it. Each release
    # carries `install.sh` as an asset; the script itself uses
    # `gh release download` (same auth the user already needs for forest)
    # to fetch the matching platform tarball.
    #
    #   gh release download --repo understory-io/forest --pattern install.sh -O - | bash
    needs: [build]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Attach install.sh to the forest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            scripts/install.sh \
            --clobber
