# Multi-arch manifest creation. Runs after ci.yaml completes its
# per-arch builds and fuses the resulting amd64 + arm64 images into
# manifest lists under the user-facing tags.
#
# `docker buildx imagetools create` talks directly to the registry's
# manifest API — no docker daemon needed, the step container just
# needs the docker CLI (which bundles buildx as a plugin since 23+).

when:
  - event: push
    branch: kjuulh/gitea-fork

depends_on:
  - ci

matrix:
  APP:
    - forest
    - forage

steps:
  merge:
    image: docker:27-cli
    environment:
      REGISTRY_TOKEN:
        from_secret: registry_token
    commands:
      - echo "$REGISTRY_TOKEN" | docker login git.kjuulh.io -u kjuulh --password-stdin
      - >
        docker buildx imagetools create
        -t git.kjuulh.io/kjuulh/${APP}:latest
        -t git.kjuulh.io/kjuulh/${APP}:rawpotion
        -t git.kjuulh.io/kjuulh/${APP}:rawpotion-${CI_COMMIT_SHA_SHORT}
        -t git.kjuulh.io/kjuulh/${APP}:rawpotion-${CI_COMMIT_SHA}
        -t git.kjuulh.io/kjuulh/${APP}:rawpotion-build${CI_PIPELINE_NUMBER}
        -t git.kjuulh.io/kjuulh/${APP}:rawpotion-ts${CI_PIPELINE_CREATED}
        git.kjuulh.io/kjuulh/${APP}:rawpotion-amd64-${CI_COMMIT_SHA_SHORT}
        git.kjuulh.io/kjuulh/${APP}:rawpotion-arm64-${CI_COMMIT_SHA_SHORT}
