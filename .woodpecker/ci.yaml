# Build + push amd64 deployment images for forest and forage on every
# push to the fork's rolling head. The production cluster is amd64-only;
# CLI release binaries remain multi-architecture in release-build.yaml.
#
# Required woodpecker secrets:
#   registry_token       — token with package:write on git.kjuulh.io/kjuulh
#
# Required woodpecker server config (admin):
#   WOODPECKER_PLUGINS_PRIVILEGED=woodpeckerci/plugin-docker-buildx
#
# Required woodpecker runner: one linux/amd64 runner.

# Only the app whose sources moved. Both legs used to build on every push:
# a forest-only commit still ran a full forage image build, and on the single
# amd64 homelab runner the two legs queue against each other, so the wasted
# leg is not just idle capacity — it is the other leg waiting.
#
# `apps/<app>` is also the Docker build context below, so a file outside it
# cannot change the image. `.woodpecker/ci.yaml` opens both legs, so a change
# to this file is exercised on both.
#
# Woodpecker evaluates `path` against the push's changed files and runs the
# pipeline when it cannot work them out (too many files, or an event with no
# diff), which is the right way round: building too much costs a runner slot,
# building too little ships the previous image under a `latest` tag that
# deploy.yaml then rolls out.
when:
  - event: push
    branch: kjuulh/gitea-fork
    path:
      include:
        - "apps/${APP}/**"
        - ".woodpecker/ci.yaml"

matrix:
  APP:
    - forest
    - forage

labels:
  platform: linux/amd64

steps:
  build-and-push:
    image: woodpeckerci/plugin-docker-buildx:5
    settings:
      registry: git.kjuulh.io
      repo: git.kjuulh.io/kjuulh/${APP}
      dockerfile: apps/${APP}/Dockerfile
      context: apps/${APP}
      username: kjuulh
      password:
        from_secret: registry_token
      build_args:
        - CARGO_NET_GIT_FETCH_WITH_CLI=true
        # Point rustc-wrapper at clank-sccache so cargo builds amortize
        # across pipelines.
        - SCCACHE_MEMCACHED_ENDPOINT=tcp://10.0.10.13:11211
        - GIT_SHA=${CI_COMMIT_SHA}
        - BUILD_TIME=${CI_PIPELINE_CREATED}
      # Production workloads run on the amd64 homelab node.
      platforms: linux/amd64
      # Rust compilation is already shared through sccache above. Avoid a
      # second BuildKit registry cache: Gitea returns HTTP 500 while committing
      # the large cache manifest, which marks otherwise-successful image pushes
      # as failed.
      # Publish the deployment tags directly; no multi-arch manifest stage
      # is needed for the amd64-only cluster.
      tags:
        - latest
        - rawpotion
        - rawpotion-${CI_COMMIT_SHA}
        - rawpotion-build${CI_PIPELINE_NUMBER}
        - rawpotion-ts${CI_PIPELINE_CREATED}
      auto_tag: false
