# Release preparation workflow.
#
# Runs on `v*` tags, with an authenticated manual fallback that requires a
# `RELEASE_TAG=vX.Y.Z` pipeline variable. Generates release notes via git-cliff,
# creates the release on src.rawpotion.io (idempotent — reuses an existing
# release if a previous pipeline ran), and uploads install.sh.
#
# The per-arch binary tarballs are uploaded by release-build.yaml,
# which `depends_on` this workflow so the release exists before the
# matrix tries to attach assets.
#
# Required woodpecker secrets:
#   rawpotion_token — gitea token with `write:repository` on
#                     src.rawpotion.io/rawpotion/forest

when:
  - event: tag
    ref: refs/tags/v*
  - event: manual

# Any platform — this workflow doesn't compile anything.

clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      partial: false
      depth: 0
      tags: true
labels:
  platform: linux/amd64

steps:
  changelog:
    image: orhunp/git-cliff:latest
    commands:
      # `git-cliff` is the standalone binary. `--strip header` removes
      # the top-level "# Changelog" line so the body slots cleanly
      # into the gitea release notes panel.
      - |
        tag="$${CI_COMMIT_TAG:-$${RELEASE_TAG:-}}"
        case "$$tag" in
          v*) ;;
          *) echo "RELEASE_TAG must be a v-prefixed release tag"; exit 1 ;;
        esac
        # `--current` requires the checked-out commit to carry the release tag,
        # so a manual run still fails safely if RELEASE_TAG and HEAD diverge.
        git-cliff --current --strip header > RELEASE_NOTES.md

  create-release:
    image: alpine:3.20
    environment:
      GITEA_TOKEN:
        from_secret: rawpotion_token
    commands:
      - apk add --no-cache curl jq
      # Create-or-reuse: GET first, POST only if missing. Makes
      # pipeline retries safe.
      - |
        tag="$${CI_COMMIT_TAG:-$${RELEASE_TAG:-}}"
        existing=$(curl -fsS -H "Authorization: token $GITEA_TOKEN" \
          "https://src.rawpotion.io/api/v1/repos/rawpotion/forest/releases/tags/$$tag" 2>/dev/null || echo "")
        body=$(jq -Rs . < RELEASE_NOTES.md)
        if echo "$existing" | jq -e .id >/dev/null 2>&1; then
          release_id=$(echo "$existing" | jq -r .id)
          curl -fsS -X PATCH \
            -H "Authorization: token $GITEA_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"name\":\"$$tag\",\"body\":$$body,\"draft\":false,\"prerelease\":false}" \
            "https://src.rawpotion.io/api/v1/repos/rawpotion/forest/releases/$$release_id" >/dev/null
          echo "Updated release for $$tag"
        else
          curl -fsS -X POST \
            -H "Authorization: token $GITEA_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"tag_name\":\"$$tag\",\"name\":\"$$tag\",\"body\":$$body,\"draft\":false,\"prerelease\":false}" \
            "https://src.rawpotion.io/api/v1/repos/rawpotion/forest/releases" >/dev/null
          echo "Created release for $$tag"
        fi
      # Upload install.sh. Gitea returns 422 if an asset with the
      # same name already exists (e.g. pipeline retry) — swallow
      # that and keep going.
      - |
        tag="$${CI_COMMIT_TAG:-$${RELEASE_TAG:-}}"
        release_id=$(curl -fsS -H "Authorization: token $GITEA_TOKEN" \
          "https://src.rawpotion.io/api/v1/repos/rawpotion/forest/releases/tags/$$tag" | jq -r .id)
        if curl -fsS -X POST \
            -H "Authorization: token $GITEA_TOKEN" \
            -F "attachment=@scripts/install.sh" \
            "https://src.rawpotion.io/api/v1/repos/rawpotion/forest/releases/$$release_id/assets?name=install.sh" >/dev/null; then
          echo "Uploaded install.sh"
        else
          echo "install.sh upload skipped (already attached)"
        fi
