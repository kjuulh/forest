# JSR release workflow.
#
# Publishes the TypeScript SDK at apps/forest/sdk/typescript to JSR under
# @rawpotion/forest-sdk. Runs on `v*` tags or through the authenticated manual
# fallback with `RELEASE_TAG=vX.Y.Z`; it is independent of the Rust binary
# build because publishing does not need the Gitea release object.
#
# The package version in apps/forest/sdk/typescript/deno.json must match the
# tag. The publish step verifies this before calling `deno publish` so a stale
# deno.json fails fast instead of pushing the wrong version to JSR.
#
# Required woodpecker secrets:
#   jsr_token — JSR publishing token from https://jsr.io/account/tokens
#               with publish rights on the @rawpotion scope.

when:
  - event: tag
    ref: refs/tags/v*
  - event: manual

labels:
  platform: linux/amd64

steps:
  publish:
    image: denoland/deno:2.7.1
    environment:
      JSR_TOKEN:
        from_secret: jsr_token
    commands:
      - |
        release_tag="$${CI_COMMIT_TAG:-$${RELEASE_TAG:-}}"
        case "$$release_tag" in
          v*) ;;
          *) echo "RELEASE_TAG must be a v-prefixed release tag"; exit 1 ;;
        esac
        cd apps/forest/sdk/typescript
        # Strip leading `v` from the tag and compare with deno.json. If they
        # diverge, refuse to publish: yanks cannot delete a wrong JSR version.
        tag_version="$${release_tag#v}"
        pkg_version=$$(deno eval "console.log(JSON.parse(Deno.readTextFileSync('deno.json')).version)")
        if [ "$$tag_version" != "$$pkg_version" ]; then
          echo "version mismatch: tag=$$tag_version deno.json=$$pkg_version"
          exit 1
        fi
        if deno eval --allow-net=jsr.io --allow-read=deno.json '
          const pkg = JSON.parse(Deno.readTextFileSync("deno.json"));
          const response = await fetch(`https://jsr.io/${pkg.name}/meta.json`);
          if (!response.ok) Deno.exit(1);
          const metadata = await response.json();
          Deno.exit(metadata.versions?.[pkg.version] ? 0 : 1);
        '; then
          echo "$$release_tag is already published to JSR — reusing"
          exit 0
        fi
        deno publish --token "$JSR_TOKEN"
