# Build + push the forest-ci plugin image (apps/forest-ci/Dockerfile).
# Multi-arch via the same matrix pattern as ci.yaml — one native runner
# per arch, fused into a manifest list in a second step.
#
# Triggered on every push to the fork's rolling head. The cost is low
# (~1 min: just curl + apt), so we don't bother gating on path changes
# — consumers always get a fresh `:rawpotion` and an immutable
# `:rawpotion-<sha>` they can pin.
#
# Required woodpecker secrets:
#   registry_token — token with package:write on git.kjuulh.io/kjuulh
#
# Required woodpecker server config (admin):
#   WOODPECKER_PLUGINS_PRIVILEGED=woodpeckerci/plugin-docker-buildx

when:
  - event: push
    branch: kjuulh/gitea-fork

matrix:
  ARCH:
    - amd64
    - arm64

labels:
  platform: linux/${ARCH}

steps:
  build-and-push:
    image: woodpeckerci/plugin-docker-buildx:5
    settings:
      registry: git.kjuulh.io
      repo: git.kjuulh.io/kjuulh/forest-ci
      dockerfile: apps/forest-ci/Dockerfile
      context: apps/forest-ci
      username: kjuulh
      password:
        from_secret: registry_token
      platforms: linux/${ARCH}
      cache_images:
        - git.kjuulh.io/kjuulh/forest-ci:buildcache-${ARCH}
      tags:
        - rawpotion-${ARCH}
        - rawpotion-${ARCH}-${CI_COMMIT_SHA_SHORT}
      auto_tag: false
