# Build + push the amd64 forest-ci plugin image. Woodpecker deploy jobs run
# on the amd64 homelab runner; CLI release binaries remain multi-architecture.
#
# Triggered on every push to the fork's rolling head. The cost is low
# (~1 min: just curl + apt), so we don't gate on path changes.
#
# Required woodpecker secrets:
#   registry_token — token with package:write on git.kjuulh.io/kjuulh
#
# Required woodpecker server config (admin):
#   WOODPECKER_PLUGINS_PRIVILEGED=woodpeckerci/plugin-docker-buildx

when:
  - event: push
    branch: kjuulh/gitea-fork

labels:
  platform: linux/amd64


steps:
  build-and-push:
    image: woodpeckerci/plugin-docker-buildx:5
    settings:
      registry: git.kjuulh.io
      repo: git.kjuulh.io/kjuulh/forest-ci
      dockerfile: apps/forest-ci/Dockerfile
      context: apps/forest-ci
      username: kjuulh
      password:
        from_secret: registry_token
      platforms: linux/amd64
      cache_images:
        - git.kjuulh.io/kjuulh/forest-ci:buildcache-amd64
      tags:
        - latest
        - rawpotion
        - rawpotion-${CI_COMMIT_SHA}
      auto_tag: false
