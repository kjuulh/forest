apiVersion: apps/v1
kind: Deployment
metadata:
  name: forest
  namespace: dev
  labels:
    app.kubernetes.io/name: forest
    app.kubernetes.io/component: server
    app.kubernetes.io/managed-by: forest
    forest.sh/managed: "true"
    forest.sh/project: "forest"
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: forest
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: forest
        app.kubernetes.io/component: server
    spec:
      containers:
        - name: forest
          image: git.kjuulh.io/kjuulh/forest:latest
          args:
            - serve
          ports:
            - name: grpc
              containerPort: 4040
              protocol: TCP
          env:
            - name: RUST_LOG
              value: "forest=debug,info"
            - name: "EXTERNAL_HOST"
              value: "https://forest.dev.forage.sh"
            - name: "FOREST_HOST"
              value: "0.0.0.0:4040"
            - name: "FOREST_TERRAFORM_V1_EXTERNAL_HOST"
              value: "https://forest.dev.forage.sh"
            - name: "LOG_LEVEL"
              value: "short"
            # forage-nats-controller writes the NATS server URL into the
            # creds Secret under both NATS_URL (env-var style) and url —
            # so apps don't need to hardcode the server URL alongside
            # the creds file in their env_vars.
            - name: NATS_CREDS
              valueFrom:
                secretKeyRef:
                  name: forest-nats-nats-creds
                  key: creds
            - name: NATS_URL
              valueFrom:
                secretKeyRef:
                  name: forest-nats-nats-creds
                  key: NATS_URL
            # forage-s3-controller writes endpoint / region / bucket-name
            # alongside the access keys, so the app shouldn't need any
            # of these hardcoded in env_vars.
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: forest-s3-s3-credentials
                  key: access-key-id
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: forest-s3-s3-credentials
                  key: secret-access-key
            - name: S3_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: forest-s3-s3-credentials
                  key: endpoint
            - name: S3_REGION
              valueFrom:
                secretKeyRef:
                  name: forest-s3-s3-credentials
                  key: region
            - name: S3_BUCKET
              valueFrom:
                secretKeyRef:
                  name: forest-s3-s3-credentials
                  key: bucket-name
          envFrom:
            - secretRef:
                name: forest-secrets
            - secretRef:
                name: forest-db-credentials
          livenessProbe:
            exec:
              command:
                - forest-server
                - --external-host
                - "http://0.0.0.0:4040"
                - admin
                - status
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 10
          readinessProbe:
            exec:
              command:
                - forest-server
                - --external-host
                - "http://0.0.0.0:4040"
                - admin
                - status
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: forest
  namespace: dev
  labels:
    app.kubernetes.io/name: forest
    app.kubernetes.io/component: server
    app.kubernetes.io/managed-by: forest
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: forest
    app.kubernetes.io/component: server
  ports:
    - name: grpc
      port: 4040
      targetPort: 4040
      protocol: TCP