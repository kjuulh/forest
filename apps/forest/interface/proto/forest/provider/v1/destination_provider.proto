syntax = "proto3";

package forest.provider.v1;

service DestinationProvider {
  // Must be side-effect free; also called as a reachability check before each release.
  rpc Describe(DescribeRequest) returns (DescribeResponse);

  // The stream must end with exactly one `outcome` event, or the release fails.
  rpc Execute(ExecuteRequest) returns (stream ExecuteEvent);
}

message DescribeRequest {}

message DescribeResponse {
  string description = 1;

  repeated MetadataField fields = 2;

  bool supports_plan = 3;

  string type_name = 4;
}

message MetadataField {
  string name = 1;
  string label = 2;
  string description = 3;
  bool required = 4;
  string field_type = 5;
  string default_value = 6;
  bool sensitive = 7;
}

enum ReleaseMode {
  RELEASE_MODE_UNSPECIFIED = 0;
  RELEASE_MODE_DEPLOY = 1;
  RELEASE_MODE_PLAN = 2;
}

message ExecuteRequest {
  ReleaseMode mode = 1;
  Destination destination = 2;
  Release release = 3;

  string release_token = 4;
  string forest_addr = 5;
}

message Destination {
  string name = 1;
  string environment = 2;
  string organisation = 3;

  map<string, string> metadata = 4;
}

message Release {
  string release_id = 1;
  string project = 2;
  string slug = 3;

  string reference_commit_sha = 4;
  string reference_commit_branch = 5;
  string reference_version = 6;
}

message ExecuteEvent {
  oneof event {
    LogLine log = 1;
    Outcome outcome = 2;
    Signal signal = 3;
  }
}

message Signal {
  string name = 1;

  // A forest.v1.HealthStatus name; forest rejects anything else.
  string status = 2;

  string detail = 3;

  // RFC 3339; empty means when forest received it.
  string observed_at = 4;
}

message LogLine {
  string channel = 1;
  string line = 2;
}

message Outcome {
  bool success = 1;

  string error_message = 2;

  string plan_output = 3;
}
