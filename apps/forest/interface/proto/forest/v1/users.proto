syntax = "proto3";

package forest.v1;

import "google/protobuf/timestamp.proto";

service UsersService {
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse);
  rpc Logout(LogoutRequest) returns (LogoutResponse);

  rpc GetUser(GetUserRequest) returns (GetUserResponse);
  rpc UpdateUser(UpdateUserRequest) returns (UpdateUserResponse);
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse);
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);

  rpc GetUserStats(GetUserStatsRequest) returns (GetUserStatsResponse);

  rpc ChangePassword(ChangePasswordRequest) returns (ChangePasswordResponse);

  rpc AddEmail(AddEmailRequest) returns (AddEmailResponse);
  rpc VerifyEmail(VerifyEmailRequest) returns (VerifyEmailResponse);
  rpc ConfirmEmailVerification(ConfirmEmailVerificationRequest) returns (ConfirmEmailVerificationResponse);
  rpc RemoveEmail(RemoveEmailRequest) returns (RemoveEmailResponse);

  rpc OAuthLogin(OAuthLoginRequest) returns (OAuthLoginResponse);
  rpc LinkOAuthProvider(LinkOAuthProviderRequest) returns (LinkOAuthProviderResponse);
  rpc UnlinkOAuthProvider(UnlinkOAuthProviderRequest) returns (UnlinkOAuthProviderResponse);

  rpc CreatePersonalAccessToken(CreatePersonalAccessTokenRequest) returns (CreatePersonalAccessTokenResponse);
  rpc ListPersonalAccessTokens(ListPersonalAccessTokensRequest) returns (ListPersonalAccessTokensResponse);
  rpc DeletePersonalAccessToken(DeletePersonalAccessTokenRequest) returns (DeletePersonalAccessTokenResponse);

  rpc TokenInfo(TokenInfoRequest) returns (TokenInfoResponse);

  rpc SetupMfa(SetupMfaRequest) returns (SetupMfaResponse);
  rpc VerifyMfa(VerifyMfaRequest) returns (VerifyMfaResponse);
  rpc DisableMfa(DisableMfaRequest) returns (DisableMfaResponse);
  rpc VerifyLoginMfa(VerifyLoginMfaRequest) returns (VerifyLoginMfaResponse);

  rpc InitiateDeviceLogin(InitiateDeviceLoginRequest) returns (InitiateDeviceLoginResponse);
  rpc PollDeviceLogin(PollDeviceLoginRequest) returns (PollDeviceLoginResponse);
  rpc ApproveDeviceLogin(ApproveDeviceLoginRequest) returns (ApproveDeviceLoginResponse);
  rpc DenyDeviceLogin(DenyDeviceLoginRequest) returns (DenyDeviceLoginResponse);
}

message User {
  string user_id = 1;
  string username = 2;
  repeated UserEmail emails = 3;
  repeated OAuthConnection oauth_connections = 4;
  bool mfa_enabled = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
  optional string profile_picture_url = 8;
}

message UserEmail {
  string email = 1;
  bool verified = 2;
}

enum OAuthProvider {
  OAUTH_PROVIDER_UNSPECIFIED = 0;
  OAUTH_PROVIDER_GITHUB = 1;
  OAUTH_PROVIDER_GOOGLE = 2;
  OAUTH_PROVIDER_GITLAB = 3;
  OAUTH_PROVIDER_MICROSOFT = 4;
  OAUTH_PROVIDER_MAGIC_LINK = 5;
}

message OAuthConnection {
  OAuthProvider provider = 1;
  string provider_user_id = 2;
  string provider_email = 3;
  google.protobuf.Timestamp linked_at = 4;
  string provider_display_name = 5;
  string provider_data_json = 6;
}

message RegisterRequest {
  string username = 1;
  string email = 2;
  string password = 3;
}

message RegisterResponse {
  User user = 1;
  // Empty when email_verification_required is true.
  AuthTokens tokens = 2;
  bool email_verification_required = 3;
}

message LoginRequest {
  oneof identifier {
    string username = 1;
    string email = 2;
  }
  string password = 3;
}

message LoginResponse {
  User user = 1;
  AuthTokens tokens = 2;
  bool mfa_required = 3;
  string mfa_session_token = 4;
}

message RefreshTokenRequest {
  string refresh_token = 1;
}

message RefreshTokenResponse {
  AuthTokens tokens = 1;
}

message LogoutRequest {
  string refresh_token = 1;
}

message LogoutResponse {}

message AuthTokens {
  string access_token = 1;
  string refresh_token = 2;
  int64 expires_in_seconds = 3;
}

message TokenInfoRequest {}

message TokenInfoResponse {
  string user_id = 1;
  int64 expires_at = 2;
}

message GetUserRequest {
  oneof identifier {
    string user_id = 1;
    string username = 2;
    string email = 3;
    ProviderIdentity provider_identity = 4;
  }
}

message ProviderIdentity {
  string provider = 1;
  string provider_user_id = 2;
}

message GetUserResponse {
  User user = 1;
}

message UpdateUserRequest {
  string user_id = 1;
  optional string username = 2;
  optional string profile_picture_url = 3;
}

message UpdateUserResponse {
  User user = 1;
}

message DeleteUserRequest {
  string user_id = 1;
}

message DeleteUserResponse {}

message ListUsersRequest {
  int32 page_size = 1;
  string page_token = 2;
  optional string search = 3;
}

message ListUsersResponse {
  repeated User users = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

message ChangePasswordRequest {
  string user_id = 1;
  string current_password = 2;
  string new_password = 3;
}

message ChangePasswordResponse {}

message AddEmailRequest {
  string user_id = 1;
  string email = 2;
}

message AddEmailResponse {
  UserEmail email = 1;
  bool email_verification_required = 2;
}

message VerifyEmailRequest {
  string user_id = 1;
  string email = 2;
}

message VerifyEmailResponse {}

message ConfirmEmailVerificationRequest {
  string email = 1;
}

message ConfirmEmailVerificationResponse {}

message RemoveEmailRequest {
  string user_id = 1;
  string email = 2;
}

message RemoveEmailResponse {}

message OAuthLoginRequest {
  OAuthProvider provider = 1;
  string provider_user_id = 2;
  string provider_email = 3;
  string provider_display_name = 4;
  string provider_data_json = 5;
}

message OAuthLoginResponse {
  User user = 1;
  AuthTokens tokens = 2;
  bool is_new_user = 3;
}

message LinkOAuthProviderRequest {
  string user_id = 1;
  OAuthProvider provider = 2;
  string provider_user_id = 3;
  string provider_email = 4;
  string provider_display_name = 5;
  string provider_data_json = 6;
}

message LinkOAuthProviderResponse {
  OAuthConnection connection = 1;
}

message UnlinkOAuthProviderRequest {
  string user_id = 1;
  OAuthProvider provider = 2;
}

message UnlinkOAuthProviderResponse {}

message PersonalAccessToken {
  string token_id = 1;
  string name = 2;
  repeated string scopes = 3;
  google.protobuf.Timestamp expires_at = 4;
  google.protobuf.Timestamp last_used = 5;
  google.protobuf.Timestamp created_at = 6;
}

message CreatePersonalAccessTokenRequest {
  string user_id = 1;
  string name = 2;
  repeated string scopes = 3;
  // 0 means no expiry.
  int64 expires_in_seconds = 4;
}

message CreatePersonalAccessTokenResponse {
  PersonalAccessToken token = 1;
  // Only returned on creation.
  string raw_token = 2;
}

message ListPersonalAccessTokensRequest {
  string user_id = 1;
}

message ListPersonalAccessTokensResponse {
  repeated PersonalAccessToken tokens = 1;
}

message DeletePersonalAccessTokenRequest {
  string token_id = 1;
}

message DeletePersonalAccessTokenResponse {}

message GetUserStatsRequest {
  oneof identifier {
    string user_id = 1;
    string username = 2;
  }
}

message GetUserStatsResponse {
  UserStats stats = 1;
}

message UserStats {
  int64 total_releases = 1;
  int64 successful_releases = 2;
  int64 failed_releases = 3;
  int64 in_progress_releases = 4;
  int64 total_annotations = 5;
  int64 total_uploads = 6;
}

enum MfaType {
  MFA_TYPE_UNSPECIFIED = 0;
  MFA_TYPE_TOTP = 1;
}

message SetupMfaRequest {
  string user_id = 1;
  MfaType mfa_type = 2;
}

message SetupMfaResponse {
  string mfa_id = 1;
  string provisioning_uri = 2;
  string secret = 3;
}

message VerifyMfaRequest {
  string mfa_id = 1;
  string code = 2;
}

message VerifyMfaResponse {}

message DisableMfaRequest {
  string user_id = 1;
  string code = 2;
}

message DisableMfaResponse {}

message VerifyLoginMfaRequest {
  string mfa_session_token = 1;
  string code = 2;
}

message VerifyLoginMfaResponse {
  User user = 1;
  AuthTokens tokens = 2;
}

message InitiateDeviceLoginRequest {
  string client_name = 1;
  string client_version = 2;
  repeated string scopes = 3;
}

message InitiateDeviceLoginResponse {
  string device_code = 1;
  string user_code = 2;
  string verification_uri = 3;
  string verification_uri_complete = 4;
  int64 expires_in_seconds = 5;
  // Polling faster yields DEVICE_LOGIN_STATUS_SLOW_DOWN.
  int32 interval_seconds = 6;
}

message PollDeviceLoginRequest {
  string device_code = 1;
}

message PollDeviceLoginResponse {
  DeviceLoginStatus status = 1;
  User user = 2;
  AuthTokens tokens = 3;
}

enum DeviceLoginStatus {
  DEVICE_LOGIN_STATUS_UNSPECIFIED = 0;
  DEVICE_LOGIN_STATUS_PENDING = 1;
  DEVICE_LOGIN_STATUS_APPROVED = 2;
  DEVICE_LOGIN_STATUS_DENIED = 3;
  DEVICE_LOGIN_STATUS_EXPIRED = 4;
  DEVICE_LOGIN_STATUS_SLOW_DOWN = 5;
}

message ApproveDeviceLoginRequest {
  string user_code = 1;
  string user_id = 2;
  string approving_ip = 3;
  string approving_user_agent = 4;
}

message ApproveDeviceLoginResponse {}

message DenyDeviceLoginRequest {
  string user_code = 1;
  string user_id = 2;
}

message DenyDeviceLoginResponse {}
