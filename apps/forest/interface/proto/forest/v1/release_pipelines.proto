syntax = "proto3";

package forest.v1;

import "forest/v1/health.proto";
import "forest/v1/releases.proto";

// ── Stage type enum (useful for UI dropdowns / filtering) ────────────

enum StageType {
    STAGE_TYPE_UNSPECIFIED = 0;
    STAGE_TYPE_DEPLOY = 1;
    STAGE_TYPE_WAIT = 2;
    STAGE_TYPE_PLAN = 3;
    STAGE_TYPE_GATE = 4;
}

// ── Per-type config messages ─────────────────────────────────────────

message DeployStageConfig {
    string environment = 1;
}

message WaitStageConfig {
    int64 duration_seconds = 1;
}

message PlanStageConfig {
    string environment = 1;
    bool auto_approve = 2;
}

// One thing a gate waits to be told, and the states it will accept.
message SignalRequirement {
    // The signal's name, as its reporter calls it — `rollout`, `smoke`.
    string signal = 1;

    // Any one of these satisfies the requirement. Empty means HEALTHY, which
    // is the only reading of "wait for this signal" that is not a trap: an
    // empty list interpreted as "any status" would open the gate on
    // UNHEALTHY.
    repeated HealthStatus accept = 2;
}

// A stage that waits for evidence rather than for a duration.
//
// This is what `WaitStageConfig` should have been. A wait stage sleeps for a
// fixed time and then declares the release fine, which is a guess; a gate waits
// to be told, by a provider or an agent, that the things it requires are in the
// states it requires — see forest/v1/signals.proto.
message GateStageConfig {
    // All of these must be satisfied. A gate with none would open instantly
    // and is rejected at validation rather than silently doing nothing.
    repeated SignalRequirement requires = 1;

    // How long to wait before `on_timeout` decides. Required: a gate that
    // waits forever blocks a pipeline with nothing reporting why, which is the
    // failure mode gates exist to remove rather than introduce.
    int64 timeout_seconds = 2;

    GateTimeoutBehaviour on_timeout = 3;
}

enum GateTimeoutBehaviour {
    // Treated as FAIL. Defaulting an unset value to "proceed" would mean a
    // gate that silently stops gating.
    GATE_TIMEOUT_BEHAVIOUR_UNSPECIFIED = 0;
    GATE_TIMEOUT_BEHAVIOUR_FAIL = 1;
    // Proceed anyway, recording that the gate timed out. For a signal that is
    // informative rather than load-bearing.
    GATE_TIMEOUT_BEHAVIOUR_PROCEED = 2;
}

// ── A single pipeline stage ──────────────────────────────────────────

message PipelineStage {
    string id = 1;
    repeated string depends_on = 2;

    oneof config {
        DeployStageConfig deploy = 10;
        WaitStageConfig wait = 11;
        PlanStageConfig plan = 12;
        GateStageConfig gate = 13;
    }
}

// ── Runtime stage status (for observing pipeline progress) ───────────

enum PipelineStageStatus {
    PIPELINE_STAGE_STATUS_UNSPECIFIED = 0;
    PIPELINE_STAGE_STATUS_PENDING = 1;
    PIPELINE_STAGE_STATUS_ACTIVE = 2;
    PIPELINE_STAGE_STATUS_SUCCEEDED = 3;
    PIPELINE_STAGE_STATUS_FAILED = 4;
    PIPELINE_STAGE_STATUS_CANCELLED = 5;
    PIPELINE_STAGE_STATUS_AWAITING_APPROVAL = 6;
    // A gate stage that is parked waiting to be told. Distinct from ACTIVE so
    // that "nothing is happening because nobody has reported" is visible
    // rather than looking like work in progress.
    PIPELINE_STAGE_STATUS_AWAITING_SIGNAL = 7;
}

// ── Pipeline resource ────────────────────────────────────────────────

message ReleasePipeline {
    string id = 1;
    string name = 2;
    bool enabled = 3;
    repeated PipelineStage stages = 4;
    string created_at = 5;
    string updated_at = 6;
}

// ── CRUD messages ────────────────────────────────────────────────────

message CreateReleasePipelineRequest {
    Project project = 1;
    string name = 2;
    repeated PipelineStage stages = 3;
}
message CreateReleasePipelineResponse {
    ReleasePipeline pipeline = 1;
}

message UpdateReleasePipelineRequest {
    Project project = 1;
    string name = 2;
    optional bool enabled = 3;
    // When set, replaces all stages. When absent, stages are unchanged.
    repeated PipelineStage stages = 4;
    bool update_stages = 5;
}
message UpdateReleasePipelineResponse {
    ReleasePipeline pipeline = 1;
}

message DeleteReleasePipelineRequest {
    Project project = 1;
    string name = 2;
}
message DeleteReleasePipelineResponse {}

message ListReleasePipelinesRequest {
    Project project = 1;
}
message ListReleasePipelinesResponse {
    repeated ReleasePipeline pipelines = 1;
}

service ReleasePipelineService {
    rpc CreateReleasePipeline(CreateReleasePipelineRequest) returns (CreateReleasePipelineResponse);
    rpc UpdateReleasePipeline(UpdateReleasePipelineRequest) returns (UpdateReleasePipelineResponse);
    rpc DeleteReleasePipeline(DeleteReleasePipelineRequest) returns (DeleteReleasePipelineResponse);
    rpc ListReleasePipelines(ListReleasePipelinesRequest) returns (ListReleasePipelinesResponse);
}
