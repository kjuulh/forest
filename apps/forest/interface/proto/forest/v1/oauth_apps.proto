syntax = "proto3";

package forest.v1;

import "google/protobuf/timestamp.proto";

service OAuthAppsService {
  rpc CreateOAuthApp(CreateOAuthAppRequest) returns (CreateOAuthAppResponse);
  rpc ListOAuthApps(ListOAuthAppsRequest) returns (ListOAuthAppsResponse);
  rpc GetOAuthApp(GetOAuthAppRequest) returns (GetOAuthAppResponse);
  rpc UpdateOAuthApp(UpdateOAuthAppRequest) returns (UpdateOAuthAppResponse);
  rpc RotateOAuthAppSecret(RotateOAuthAppSecretRequest) returns (RotateOAuthAppSecretResponse);
  rpc DeleteOAuthApp(DeleteOAuthAppRequest) returns (DeleteOAuthAppResponse);

  rpc LookupOAuthClient(LookupOAuthClientRequest) returns (LookupOAuthClientResponse);
  rpc CreateOAuthAuthorizationCode(CreateOAuthAuthorizationCodeRequest) returns (CreateOAuthAuthorizationCodeResponse);
  rpc ExchangeOAuthCode(ExchangeOAuthCodeRequest) returns (ExchangeOAuthCodeResponse);
  rpc GetOAuthUserinfo(GetOAuthUserinfoRequest) returns (GetOAuthUserinfoResponse);
  rpc IssueClientCredentialsToken(IssueClientCredentialsTokenRequest) returns (IssueClientCredentialsTokenResponse);
  rpc IntrospectClientToken(IntrospectClientTokenRequest) returns (IntrospectClientTokenResponse);
  rpc RefreshOAuthToken(RefreshOAuthTokenRequest) returns (RefreshOAuthTokenResponse);
  rpc RevokeOAuthGrant(RevokeOAuthGrantRequest) returns (RevokeOAuthGrantResponse);
  rpc ListOAuthGrants(ListOAuthGrantsRequest) returns (ListOAuthGrantsResponse);
  rpc GetOAuthConsent(GetOAuthConsentRequest) returns (GetOAuthConsentResponse);

  rpc InitiateOAuthDeviceAuthorization(InitiateOAuthDeviceAuthorizationRequest) returns (InitiateOAuthDeviceAuthorizationResponse);
  rpc LookupOAuthDeviceAuthorization(LookupOAuthDeviceAuthorizationRequest) returns (LookupOAuthDeviceAuthorizationResponse);
  rpc ApproveOAuthDeviceAuthorization(ApproveOAuthDeviceAuthorizationRequest) returns (ApproveOAuthDeviceAuthorizationResponse);
  rpc DenyOAuthDeviceAuthorization(DenyOAuthDeviceAuthorizationRequest) returns (DenyOAuthDeviceAuthorizationResponse);
  rpc ExchangeOAuthDeviceCode(ExchangeOAuthDeviceCodeRequest) returns (ExchangeOAuthDeviceCodeResponse);
}

message OAuthTokens {
  string access_token = 1;
  string refresh_token = 2;
  string token_type = 3;
  int64 expires_in_seconds = 4;
  repeated string scopes = 5;
  // Present only when the `openid` scope was granted.
  string id_token = 6;
}

message LookupOAuthClientRequest {
  string client_id = 1;
}

message LookupOAuthClientResponse {
  string app_id = 1;
  string organisation_id = 2;
  string name = 3;
  string description = 4;
  string homepage_url = 5;
  repeated string redirect_uris = 6;
  repeated string scopes = 7;
  bool public = 8;
}

message CreateOAuthAuthorizationCodeRequest {
  string client_id = 1;
  string user_id = 2;
  string redirect_uri = 3;
  repeated string scopes = 4;
  string code_challenge = 5;
  string code_challenge_method = 6;
  string nonce = 7;
}

message CreateOAuthAuthorizationCodeResponse {
  string code = 1;
  int64 expires_in_seconds = 2;
}

message ExchangeOAuthCodeRequest {
  string client_id = 1;
  string client_secret = 2;
  string code = 3;
  string redirect_uri = 4;
  string code_verifier = 5;
}

message ExchangeOAuthCodeResponse {
  OAuthTokens tokens = 1;
}

message IssueClientCredentialsTokenRequest {
  string client_id = 1;
  string client_secret = 2;
  repeated string scopes = 3;
}

message IssueClientCredentialsTokenResponse {
  string access_token = 1;
  string token_type = 2;
  int64 expires_in_seconds = 3;
  repeated string scopes = 4;
}

message IntrospectClientTokenRequest {
  string access_token = 1;
}

message IntrospectClientTokenResponse {
  bool active = 1;
  // Empty when the token is not live (unknown, expired or revoked).
  string app_id = 2;
  string organisation_id = 3;
  repeated string scopes = 4;
  string user_id = 5;
  string username = 6;
  repeated IntrospectedOrganisation organisations = 7;
}

message IntrospectedOrganisation {
  string organisation_id = 1;
  string name = 2;
}

message GetOAuthUserinfoRequest {
  string access_token = 1;
}

message OAuthUserinfo {
  string sub = 1;
  string username = 2;
  string profile_picture_url = 3;
  string email = 4;
  repeated string emails = 5;
  repeated string scopes = 6;
}

message GetOAuthUserinfoResponse {
  OAuthUserinfo userinfo = 1;
}

message RefreshOAuthTokenRequest {
  string client_id = 1;
  string client_secret = 2;
  string refresh_token = 3;
}

message RefreshOAuthTokenResponse {
  OAuthTokens tokens = 1;
}

message RevokeOAuthGrantRequest {
  string user_id = 1;
  string app_id = 2;
}

message RevokeOAuthGrantResponse {
  uint32 revoked_count = 1;
}

message ListOAuthGrantsRequest {
  string user_id = 1;
}

message OAuthGrant {
  string app_id = 1;
  string name = 2;
  repeated string scopes = 3;
  google.protobuf.Timestamp authorized_at = 4;
}

message ListOAuthGrantsResponse {
  repeated OAuthGrant grants = 1;
}

message GetOAuthConsentRequest {
  string client_id = 1;
  string user_id = 2;
}

message GetOAuthConsentResponse {
  repeated string scopes = 1;
}

message InitiateOAuthDeviceAuthorizationRequest {
  string client_id = 1;
  string client_secret = 2;
  repeated string scopes = 3;
}

message InitiateOAuthDeviceAuthorizationResponse {
  string device_code = 1;
  string user_code = 2;
  string verification_uri = 3;
  string verification_uri_complete = 4;
  int64 expires_in_seconds = 5;
  int32 interval_seconds = 6;
}

message LookupOAuthDeviceAuthorizationRequest {
  string user_code = 1;
}

message LookupOAuthDeviceAuthorizationResponse {
  string client_id = 1;
  string name = 2;
  string homepage_url = 3;
  repeated string scopes = 4;
}

message ApproveOAuthDeviceAuthorizationRequest {
  string user_code = 1;
  string user_id = 2;
  string approving_ip = 3;
  string approving_user_agent = 4;
}

message ApproveOAuthDeviceAuthorizationResponse {}

message DenyOAuthDeviceAuthorizationRequest {
  string user_code = 1;
  string user_id = 2;
}

message DenyOAuthDeviceAuthorizationResponse {}

message ExchangeOAuthDeviceCodeRequest {
  string client_id = 1;
  string client_secret = 2;
  string device_code = 3;
}

enum OAuthDeviceTokenStatus {
  O_AUTH_DEVICE_TOKEN_STATUS_UNSPECIFIED = 0;
  O_AUTH_DEVICE_TOKEN_STATUS_ISSUED = 1;
  O_AUTH_DEVICE_TOKEN_STATUS_AUTHORIZATION_PENDING = 2;
  O_AUTH_DEVICE_TOKEN_STATUS_SLOW_DOWN = 3;
  O_AUTH_DEVICE_TOKEN_STATUS_ACCESS_DENIED = 4;
  O_AUTH_DEVICE_TOKEN_STATUS_EXPIRED_TOKEN = 5;
}

message ExchangeOAuthDeviceCodeResponse {
  OAuthDeviceTokenStatus status = 1;
  OAuthTokens tokens = 2;
}

message OAuthApp {
  string app_id = 1;
  string organisation_id = 2;
  string name = 3;
  string description = 4;
  string homepage_url = 5;
  string client_id = 6;
  repeated string redirect_uris = 7;
  repeated string scopes = 8;
  repeated string grant_types = 12;
  string created_by = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
  bool public = 13;
}

message CreateOAuthAppRequest {
  string organisation_id = 1;
  string name = 2;
  string description = 3;
  string homepage_url = 4;
  repeated string redirect_uris = 5;
  repeated string scopes = 6;
  // Empty defaults to ["authorization_code"].
  repeated string grant_types = 7;
  bool public = 8;
}

message CreateOAuthAppResponse {
  OAuthApp app = 1;
  // Only returned on creation; empty for a public app.
  string client_secret = 2;
}

message ListOAuthAppsRequest {
  string organisation_id = 1;
}

message ListOAuthAppsResponse {
  repeated OAuthApp apps = 1;
}

message GetOAuthAppRequest {
  string organisation_id = 1;
  string app_id = 2;
}

message GetOAuthAppResponse {
  OAuthApp app = 1;
}

message UpdateOAuthAppRequest {
  string organisation_id = 1;
  string app_id = 2;
  string name = 3;
  string description = 4;
  string homepage_url = 5;
  repeated string redirect_uris = 6;
  repeated string scopes = 7;
  // Removing a grant immediately invalidates its in-flight codes and refresh tokens.
  repeated string grant_types = 8;
}

message UpdateOAuthAppResponse {
  OAuthApp app = 1;
}

message RotateOAuthAppSecretRequest {
  string organisation_id = 1;
  string app_id = 2;
}

message RotateOAuthAppSecretResponse {
  OAuthApp app = 1;
  // Only returned on rotation.
  string client_secret = 2;
}

message DeleteOAuthAppRequest {
  string organisation_id = 1;
  string app_id = 2;
}

message DeleteOAuthAppResponse {}
