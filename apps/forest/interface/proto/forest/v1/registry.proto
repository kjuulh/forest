syntax = "proto3";

package forest.v1;

service RegistryService {
  rpc GetComponents(GetComponentsRequest) returns (GetComponentsResponse) {}
  rpc GetComponent(GetComponentRequest) returns (GetComponentResponse) {}
  rpc GetComponentVersion(GetComponentVersionRequest) returns (GetComponentVersionResponse) {}
  rpc BeginUpload(BeginUploadRequest) returns (BeginUploadResponse) {}
  rpc UploadFile(UploadFileRequest) returns (UploadFileResponse) {}
  rpc CommitUpload(CommitUploadRequest) returns (CommitUploadResponse) {}
  rpc AbortUpload(AbortUploadRequest) returns (AbortUploadResponse) {}
  rpc GetComponentFiles(GetComponentFilesRequest) returns (stream GetComponentFilesResponse) {}

  rpc UploadBinary(stream UploadBinaryRequest) returns (UploadBinaryResponse) {}
  rpc DownloadBinary(DownloadBinaryRequest) returns (stream DownloadBinaryResponse) {}
  rpc PublishManifest(PublishManifestRequest) returns (PublishManifestResponse) {}
  rpc GetComponentManifest(GetComponentManifestRequest) returns (GetComponentManifestResponse) {}
  rpc ListComponentVersions(ListComponentVersionsRequest) returns (ListComponentVersionsResponse) {}

  // Idempotent: unpublishing an unpublished or unknown version succeeds.
  rpc UnpublishVersion(UnpublishVersionRequest) returns (UnpublishVersionResponse) {}

  rpc SearchComponents(SearchComponentsRequest) returns (SearchComponentsResponse) {}
  rpc GetComponentDetail(GetComponentDetailRequest) returns (GetComponentDetailResponse) {}

  rpc SearchPublicComponents(SearchPublicComponentsRequest) returns (SearchPublicComponentsResponse) {}
  rpc GetPublicComponentDetail(GetPublicComponentDetailRequest) returns (GetPublicComponentDetailResponse) {}
  rpc GetPublicComponentManifest(GetPublicComponentManifestRequest) returns (GetPublicComponentManifestResponse) {}

  rpc ListOrgTools(ListOrgToolsRequest) returns (stream OrgToolEntry) {}
}

message GetComponentsRequest {}
message GetComponentsResponse {}

message GetComponentRequest {
  string name = 1;
  string organisation = 2;
}
message GetComponentResponse {
  optional Component component = 1;
}

message Component {
  string id = 1;
  string version = 2;
}

message GetComponentVersionRequest {
  string name = 1;
  string organisation = 2;
  string version = 3;
}
message GetComponentVersionResponse {
  optional Component component = 1;
}

message BeginUploadRequest {
  string name = 1;
  string organisation = 2;
  string version = 3;
}
message BeginUploadResponse {
  string upload_context = 1;
}

message UploadFileRequest {
  string upload_context = 1;
  string file_path = 2;
  bytes file_content = 3;
}
message UploadFileResponse {}

message CommitUploadRequest {
  string upload_context = 1;
}
message CommitUploadResponse {}

message AbortUploadRequest {
  string upload_context = 1;
  // Truncated server-side at 256 chars.
  string reason = 2;
}
message AbortUploadResponse {}

message GetComponentFilesRequest {
  string component_id = 1;
}
message GetComponentFilesResponse {
  oneof msg {
    Done done = 1;
    ComponentFile component_file = 2;
  }
}

message ComponentFile {
  string file_path = 1;
  bytes file_content = 2;
}

message Done {}

message UploadBinaryRequest {
  oneof msg {
    UploadBinaryMetadata metadata = 1;
    bytes chunk = 2;
  }
}

message UploadBinaryMetadata {
  string upload_context = 1;
  string os = 2;
  string arch = 3;
  string sha256 = 4;
}

message UploadBinaryResponse {
  uint64 size_bytes = 1;
}

message DownloadBinaryRequest {
  string organisation = 1;
  string name = 2;
  string version = 3;
  string os = 4;
  string arch = 5;
  // `length` 0 means the whole binary (with `offset` 0); an `offset` past the end is OUT_OF_RANGE.
  uint64 offset = 6;
  uint64 length = 7;
  // When set and the stored binary differs, fails with FAILED_PRECONDITION.
  string expected_sha256 = 8;
}

message DownloadBinaryResponse {
  bytes chunk = 1;
  uint64 offset = 2;
  // Set on the first message only, and never by a server that predates ranges.
  uint64 total_size = 3;
  string sha256 = 4;
}

message PublishManifestRequest {
  string upload_context = 1;
  string manifest_json = 2;
}
message PublishManifestResponse {}

message GetComponentManifestRequest {
  string organisation = 1;
  string name = 2;
  string version = 3;
}
message GetComponentManifestResponse {
  string manifest_json = 1;
}

message ListComponentVersionsRequest {
  string organisation = 1;
  string name = 2;
}
message ListComponentVersionsResponse {
  repeated ComponentVersionInfo versions = 1;
}

message ComponentVersionInfo {
  string version = 1;
  string protocol_version = 2;
  string kind = 3;
  repeated string platforms = 4;
  string created_at = 5;
}

message UnpublishVersionRequest {
  string organisation = 1;
  string name = 2;
  string version = 3;
  // Truncated server-side at 1024 chars.
  string reason = 4;
}
message UnpublishVersionResponse {
  // False when the version was already unpublished.
  bool unpublished = 1;
}

message SearchComponentsRequest {
  string query = 1;
  string organisation = 2;
  // 0-indexed.
  int32 page = 3;
  int32 page_size = 4;
}
message SearchComponentsResponse {
  repeated ComponentSummary components = 1;
  int32 total_count = 2;
}

message ComponentSummary {
  string organisation = 1;
  string name = 2;
  string latest_version = 3;
  string kind = 4;
  string description = 5;
  string created_at = 6;
  string updated_at = 7;
  int32 version_count = 8;
  repeated string contracts = 9;
  string visibility = 10;

  ComponentShape shape    = 11;
  ToolFacet      tool     = 12;
  repeated string methods = 13;
  string upstream_host    = 14;
}

message GetComponentDetailRequest {
  string organisation = 1;
  string name = 2;
}
message GetComponentDetailResponse {
  ComponentSummary summary = 1;
  repeated ComponentVersionInfo versions = 2;
  string readme = 3;
  string manifest_json = 4;
  repeated string owners = 5;
}

message SearchPublicComponentsRequest {
  string query = 1;
  string organisation = 2;
  int32 page = 3;
  int32 page_size = 4;
}
message SearchPublicComponentsResponse {
  repeated ComponentSummary components = 1;
  int32 total_count = 2;
}

message GetPublicComponentDetailRequest {
  string organisation = 1;
  string name = 2;
}
message GetPublicComponentDetailResponse {
  ComponentSummary summary = 1;
  repeated ComponentVersionInfo versions = 2;
  string readme = 3;
  string manifest_json = 4;
  repeated string owners = 5;
}

message GetPublicComponentManifestRequest {
  string organisation = 1;
  string name = 2;
  string version = 3;
}
message GetPublicComponentManifestResponse {
  string manifest_json = 1;
}

enum ComponentShape {
  COMPONENT_SHAPE_UNSPECIFIED   = 0;
  COMPONENT_SHAPE_COMPONENT     = 1;
  COMPONENT_SHAPE_HYBRID        = 2;
  COMPONENT_SHAPE_TOOL_BINARY   = 3;
  COMPONENT_SHAPE_TOOL_EXTERNAL = 4;
}

message ToolFacet {
  string name             = 1;
  bool   argv_passthrough = 2;
  string description      = 3;
}

message ListOrgToolsRequest {
  string organisation = 1;
}

message OrgToolEntry {
  string         organisation   = 1;
  string         name           = 2;
  string         latest_version = 3;
  ToolFacet      tool           = 4;
  ComponentShape shape          = 5;
  string         upstream_host  = 6;
}
