[package]
name = "forage-server"
version = "0.1.0"
edition = "2024"

[dependencies]
forage-core = { path = "../forage-core" }
forage-db = { path = "../forage-db" }
forage-grpc = { path = "../forage-grpc", features = ["client", "server"] }
anyhow.workspace = true
chrono.workspace = true
async-trait.workspace = true
axum.workspace = true
axum-extra.workspace = true
minijinja.workspace = true
serde.workspace = true
sqlx.workspace = true
serde_json.workspace = true
tokio.workspace = true
tonic.workspace = true
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
time.workspace = true
uuid.workspace = true
urlencoding = "2.1.3"
base64 = "0.22"
opentelemetry.workspace = true
opentelemetry_sdk.workspace = true
opentelemetry-otlp.workspace = true
tracing-opentelemetry.workspace = true
# Telemetry was wired through canopy-otel upstream (private github dep
# at understory-io/canopy-util-rs). Removed on the rawpotion fork — no
# SSH access to that repo. `optional = true` + a feature gate didn't
# help: Cargo eagerly resolves git deps to validate the lockfile, so the
# fetch happens regardless of whether the feature is on. Restore upstream
# by re-adding this line + the `let _otel = canopy_otel::init()` call in
# src/main.rs.
futures-util = "0.3"
tokio-stream = "0.1"
reqwest.workspace = true
hmac.workspace = true
sha2.workspace = true
notmad.workspace = true
nostatus.workspace = true
