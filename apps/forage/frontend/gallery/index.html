<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Release timeline — rendered states</title>
    <link rel="stylesheet" href="./gallery.css" />
    <!-- The app's dark palette, re-scoped so the toggle can switch it.
         Generated from static/css/input.css — see gallery/dark-mirror.js. -->
    <link rel="stylesheet" href="/@gallery/dark-mirror.css" />
  </head>
  <body>
    <div class="gal-bar">
      <strong>release-timeline</strong>
      <span class="gal-group" data-control="theme">
        Theme
        <button type="button" data-value="light">Light</button>
        <button type="button" data-value="dark">Dark</button>
      </span>
    </div>

    <div class="gal-stage" id="gallery"></div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
