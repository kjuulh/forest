[tools]
rust = "latest"
node = "latest"
"github:tailwindlabs/tailwindcss" = "4"

[env]
_.file = ".env"

[tasks.develop]
alias = ["d", "dev"]
description = "Start the forage development server with postgres"
depends = ["frontend:build", "tailwind:build", "local:up"]
run = "cargo run -p forage-server"

[tasks.build]
description = "Build release binary"
run = "cargo build --release -p forage-server"

[tasks.compile]
description = "Build entire workspace in release mode"
run = "cargo build --release"

[tasks.test]
description = "Run all tests"
depends = ["frontend:test"]
run = "cargo test --workspace"

[tasks."test:all"]
description = "Run all tests including rendered component states"
depends = ["frontend:test", "frontend:test:render"]
run = "cargo test --workspace"

[tasks.check]
description = "Run cargo check and clippy"
run = ["cargo check --workspace", "cargo clippy --workspace -- -D warnings"]

[tasks.fmt]
description = "Format all code"
run = "cargo fmt"

[tasks."fmt:check"]
description = "Check formatting"
run = "cargo fmt -- --check"

[tasks."docker:build"]
description = "Build forage-server Docker image"
run = "docker build -f templates/forage-server.Dockerfile -t forage/forage-server:dev ."

[tasks."docker:publish"]
description = "Build and publish Docker image with tags"
run = """
COMMIT=$(git rev-parse --short HEAD)
TIMESTAMP=$(date +%Y%m%d%H%M%S)
REGISTRY=${CI_REGISTRY:-registry.forage.sh}
IMAGE=${CI_IMAGE_NAME:-forage/forage-server}
docker build -f templates/forage-server.Dockerfile \
  -t $REGISTRY/$IMAGE:latest \
  -t $REGISTRY/$IMAGE:$COMMIT \
  -t $REGISTRY/$IMAGE:$TIMESTAMP \
  .
docker push $REGISTRY/$IMAGE:latest
docker push $REGISTRY/$IMAGE:$COMMIT
docker push $REGISTRY/$IMAGE:$TIMESTAMP
"""

[tasks."local:up"]
description = "Start local services (postgres)"
run = "docker compose -f templates/docker-compose.yaml up -d --wait"

[tasks."local:down"]
description = "Stop and remove local services"
run = "docker compose -f templates/docker-compose.yaml down -v"

[tasks."local:logs"]
description = "Tail local service logs"
run = "docker compose -f templates/docker-compose.yaml logs -f"

[tasks."db:shell"]
description = "Connect to local postgres"
run = "psql postgresql://forageuser:foragepassword@localhost:5433/forage"

[tasks."db:migrate"]
description = "Run database migrations"
run = "cargo sqlx migrate run --source crates/forage-db/src/migrations"

[tasks."db:prepare"]
description = "Prepare sqlx offline query cache"
run = "cargo sqlx prepare --workspace"

[tasks."tailwind:build"]
description = "Build tailwind CSS"
sources = ["templates/**/*.jinja", "static/css/input.css", "static/js/**/*.js"]
outputs = ["static/css/style.css"]
run = "tailwindcss -i static/css/input.css -o static/css/style.css --minify"

[tasks."tailwind:watch"]
description = "Watch and rebuild tailwind CSS"
run = "tailwindcss -i static/css/input.css -o static/css/style.css --watch"

[tasks."frontend:install"]
description = "Install Svelte frontend npm dependencies"
dir = "frontend"
sources = ["frontend/package.json", "frontend/package-lock.json"]
outputs = ["frontend/node_modules/.package-lock.json"]
run = "npm install"

[tasks."frontend:build"]
description = "Build Svelte web components"
depends = ["frontend:install"]
dir = "frontend"
sources = [
  "frontend/src/**/*.svelte",
  "frontend/src/**/*.js",
  "frontend/package.json",
  "frontend/vite.config.js",
]
outputs = ["static/js/components/forage-components.js"]
run = "npm run build"

[tasks."frontend:test"]
description = "Unit-test the Svelte component logic"
depends = ["frontend:install"]
dir = "frontend"
run = "npm test"

[tasks."frontend:test:render"]
description = "Assert rendered component states, and the built bundle, in a real browser"
depends = ["frontend:install", "frontend:build"]
dir = "frontend"
run = """
if ! npx playwright install chromium --dry-run >/dev/null 2>&1; then
  echo "playwright unavailable — skipping render tests"; exit 0
fi
npm run gallery:capture
npm run test:bundle
"""

[tasks."frontend:watch"]
description = "Watch and rebuild Svelte components"
depends = ["frontend:install"]
dir = "frontend"
run = "npm run dev"

[tasks."test:webhook"]
description = "Start a webhook test server on port 9876"
run = "python3 tools/webhook-test-server.py"

[tasks."forest:run"]
description = "Run a forest command"
run = "forest run {{arg(name='cmd')}}"
